/* ------------------------------------------------------------------
   window.storage solo existe dentro de Claude. Fuera de ahi usamos
   el almacenamiento del navegador para que la app guarde igual.
   ------------------------------------------------------------------ */
if (!window.storage) {
  window.storage = {
    get: async (k) => {
      const v = localStorage.getItem(k);
      if (v === null) throw new Error("no existe");
      return { key: k, value: v };
    },
    set: async (k, v) => { localStorage.setItem(k, v); return { key: k, value: v }; },
    delete: async (k) => { localStorage.removeItem(k); return { key: k, deleted: true }; },
    list: async (p = "") => ({ keys: Object.keys(localStorage).filter((k) => k.startsWith(p)) }),
  };
}

const { useState, useEffect, useMemo, useRef } = React;

/* ==================================================================
   BateríApp v2 — Tienda en línea + Panel de administración
   Tienda con estructura de e-commerce, fotos por producto e
   ilustración vectorial de respaldo. Configurado para Costa Rica.

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  --disp:'Barlow Condensed',Impact,sans-serif;
  --cols:3;
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100vh;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
}
.bat *{box-sizing:border-box;}
.bat button{font-family:inherit;cursor:pointer;}
.bat input,.bat select,.bat textarea{font-family:inherit;font-size:14px;}
.bat :focus-visible{outline:3px solid var(--pos);outline-offset:2px;}
.bat img{max-width:100%;display:block;}

.bat .disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.01em;line-height:.95;font-weight:700;}
.bat .mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.bat .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.bat .wrap{max-width:1280px;margin:0 auto;padding:0 20px;}

/* ---------- barra de anuncio + encabezado ---------- */
.bat .ticker{background:var(--volt);color:var(--neg);text-align:center;padding:6px 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;}
.bat .topbar{background:var(--neg);color:#F2F2EE;position:sticky;top:0;z-index:40;}
.bat .topbar-in{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;}
.bat .logo{display:flex;align-items:center;gap:9px;flex:none;min-width:0;}
.bat .logo-mark{width:32px;height:23px;border:2px solid var(--volt);border-radius:3px;position:relative;flex:none;display:flex;align-items:flex-end;gap:2px;padding:2px;}
.bat .logo-mark:after{content:"";position:absolute;right:-5px;top:5px;width:3px;height:9px;background:var(--volt);border-radius:0 2px 2px 0;}
.bat .logo-mark i{flex:1;background:var(--volt);border-radius:1px;display:block;}
.bat .logo-mark i:nth-child(1){height:100%;}.bat .logo-mark i:nth-child(2){height:66%;opacity:.6;}.bat .logo-mark i:nth-child(3){height:36%;opacity:.32;}
.bat .logo-txt{font-family:var(--disp);font-size:23px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bat .hsearch{flex:1 1 auto;position:relative;min-width:110px;}
.bat .hsearch input{width:100%;padding:9px 12px 9px 32px;border:1px solid rgba(242,242,238,.24);border-radius:2px;background:rgba(255,255,255,.07);color:#F2F2EE;}
.bat .hsearch input::placeholder{color:#8B9194;}
.bat .hsearch span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#8B9194;font-size:13px;}
.bat .navbtn{background:none;border:1px solid rgba(242,242,238,.26);color:#F2F2EE;padding:8px 13px;border-radius:2px;font-size:12.5px;white-space:nowrap;flex:none;}
.bat .navbtn:hover{border-color:var(--volt);color:var(--volt);}
.bat .cartbtn{background:var(--volt);color:var(--neg);border:none;padding:9px 14px;border-radius:2px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px;flex:none;}
.bat .cartbtn .pill{background:var(--neg);color:var(--volt);border-radius:9px;padding:0 6px;font-family:var(--mono);font-size:11px;}

/* ---------- navegación de categorías ---------- */
.bat .catnav{background:#292E32;border-bottom:3px solid var(--volt);overflow-x:auto;}
.bat .catnav-in{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px;}
.bat .catnav button{background:none;border:none;color:#C3C8CA;padding:11px 15px;font-size:12.5px;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
.bat .catnav button:hover{color:var(--volt);}

/* ---------- banner de colección ---------- */
.bat .collhead{background:var(--neg);color:#F2F2EE;padding:34px 0 30px;position:relative;overflow:hidden;}

.bat .collhead-in{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;}

.bat .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
.bat .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px;}

.bat .modal-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;}

.bat .x{background:none;border:none;font-size:22px;line-height:1;color:var(--muted);padding:0 4px;}

/* ---------- avisos / pie ---------- */
.bat .note{border:1px solid var(--warn);border-left:3px solid var(--warn);background:#FFF8E8;padding:11px 13px;border-radius:2px;font-size:12.5px;color:#5C4600;margin-bottom:16px;}
.bat .empty{text-align:center;padding:46px 18px;color:var(--muted);}
.bat .empty b{display:block;font-family:var(--disp);font-size:24px;text-transform:uppercase;color:var(--ink);margin-bottom:6px;}
.bat .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--neg);color:var(--volt);padding:11px 20px;border-radius:2px;font-family:var(--mono);font-size:13px;z-index:90;}

.bat footer{background:var(--neg);color:#8E9497;margin-top:46px;padding:30px 0;font-size:12.5px;}
.bat footer a{color:var(--volt);cursor:pointer;text-decoration:underline;}
.bat .foot{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;}

  .bat .shop{grid-template-columns:1fr;}

  .bat .logo-txt{font-size:19px;}

@media (prefers-reduced-motion:reduce){ .bat *{transition:none!important;animation:none!important;} }

/* ====================== ILUSTRACIÓN VECTORIAL ====================== */

const COLOR_MARCA = {
  LTH: "#E4002B", ACDelco: "#0057A8", Bosch: "#C8102E",
  Optima: "#E2231A", Yuasa: "#003DA5", Trojan: "#8B1F2F", Varta: "#0A3C6E",
};

const colorMarca = (m = "") => {
  if (COLOR_MARCA[m]) return COLOR_MARCA[m];
  let h = 0;
  for (let i = 0; i < m.length; i++) h = (h * 31 + m.charCodeAt(i)) % 360;
  return `hsl(${h},52%,42%)`;
};

const colorCaja = (tipo = "") => {
  if (tipo.includes("AGM")) return ["#22262A", "#31363B"];
  if (tipo.includes("Ciclo")) return ["#5E1F2B", "#75303C"];
  if (tipo.includes("pesado")) return ["#1F2225", "#2C3034"];
  if (tipo.includes("Gel")) return ["#1B3038", "#264049"];
  return ["#26313A", "#33414C", ];
};

function BateriaSVG({ p }) {
  const [oscuro, claro] = colorCaja(p.tipo);
  const acento = colorMarca(p.marca);
  const izq = p.pol === "Izquierda";
  const moto = p.grupo === "Moto";
  const alto = moto ? 62 : 92;
  const ancho = moto ? 96 : 142;
  const x0 = (200 - ancho) / 2 - 8;
  const y0 = 150 - alto;
  const dx = 22, dy = 18;
  const px = izq ? x0 + 20 : x0 + ancho - 20;
  const nx = izq ? x0 + ancho - 20 : x0 + 20;

  const Poste = ({ cx, tipo }) => (

function Foto({ p, imgs }) {
  const src = imgs?.[p.id] || (p.img || "").trim();

}

const descargarCSV = (nombre, filas) => {
  const csv = filas.map((f) => f.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8;" }));
  const a = document.createElement("a");
  a.href = url; a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
};

/** Reduce la foto a 620 px y la comprime, para que quepa en el almacenamiento. */
const comprimirImagen = (file) =>
  new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onerror = () => mal(new Error("lectura"));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => mal(new Error("imagen"));
      im.onload = () => {
        const max = 620;
        const esc = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * esc);
        cv.height = Math.round(im.height * esc);
        const cx = cv.getContext("2d");
        cx.fillStyle = "#F2F2ED";
        cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL("image/jpeg", 0.72));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });

function Campo({ label, children }) {

function Modal({ titulo, onClose, children, acciones, ancho }) {
  useEffect(() => {
    const esc = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [onClose]);
  return (
    <div className="modal" onMouseDown={(e) => e.target === e.currentTarget && onClose()}>
      <div className="modal-in" style={ancho ? { width: `min(${ancho}px,100%)` } : undefined}>
        <div className="modal-h">
          <span className="disp" style={{ fontSize: 21 }}>{titulo}</span>
          <button className="x" onClick={onClose} aria-label="Cerrar">×</button>
        </div>
        <div className="modal-b">{children}</div>
        {acciones && <div className="modal-f">{acciones}</div>}
      </div>
    </div>
  );
}

function Segmentos({ stock, min }) {
  const llenos = stock <= 0 ? 0 : Math.max(1, Math.min(5, Math.round((stock / Math.max(min * 2, 5)) * 5)));
  const bajo = stock > 0 && stock <= min;
  return (
    <span className="segs" aria-hidden="true">
      {[0, 1, 2, 3, 4].map((i) => <span key={i} className={`seg${i < llenos ? " f" : ""}${bajo ? " low" : ""}`} />)}
    </span>
  );
}

function Filtros({ base, f, setF, config }) {
  const cuenta = (campo, valor) => base.filter((p) => p[campo] === valor).length;
  const marcas = [...new Set(base.map((p) => p.marca))].sort();
  const tipos = [...new Set(base.map((p) => p.tipo))].sort();
  const grupos = [...new Set(base.map((p) => p.grupo))].sort();

  const alternar = (llave, v) =>
    setF((s) => ({ ...s, [llave]: s[llave].includes(v) ? s[llave].filter((x) => x !== v) : [...s[llave], v] }));

  return (
    <>
      <div className="fgroup">
        <h4>Marca</h4>
        {marcas.map((m) => (
          <label className="fopt" key={m}>
            <input type="checkbox" checked={f.marcas.includes(m)} onChange={() => alternar("marcas", m)} />
            {m}<span className="n">({cuenta("marca", m)})</span>
          </label>
        ))}
      </div>
      <div className="fgroup">
        <h4>Tipo</h4>
        {tipos.map((t) => (
          <label className="fopt" key={t}>
            <input type="checkbox" checked={f.tipos.includes(t)} onChange={() => alternar("tipos", t)} />
            {t}<span className="n">({cuenta("tipo", t)})</span>
          </label>
        ))}
      </div>
      <div className="fgroup">
        <h4>Grupo BCI</h4>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
          {grupos.map((g) => (
            <button key={g} className={`chip${f.grupos.includes(g) ? " on" : ""}`} onClick={() => alternar("grupos", g)}>{g}</button>
          ))}
        </div>
      </div>
      <div className="fgroup">
        <h4>Precio</h4>
        <div className="frange">
          <input type="number" placeholder="De" value={f.min} onChange={(e) => setF({ ...f, min: e.target.value })} />
          <span className="mono" style={{ color: "var(--muted)" }}>a</span>
          <input type="number" placeholder="A" value={f.max} onChange={(e) => setF({ ...f, max: e.target.value })} />
        </div>
        <div className="mono" style={{ fontSize: 10.5, color: "var(--muted)", marginTop: 6 }}>Valores en {config.moneda}</div>
      </div>
      <div className="fgroup">
        <h4>Disponibilidad</h4>
        <label className="fopt">
          <input type="checkbox" checked={f.soloStock} onChange={(e) => setF({ ...f, soloStock: e.target.checked })} />
          Solo en existencia
        </label>
      </div>
      <button className="btn ghost sm" style={{ marginTop: 14, width: "100%" }}
        onClick={() => setF({ marcas: [], tipos: [], grupos: [], min: "", max: "", soloStock: false })}>
        Eliminar todos los filtros
      </button>
    </>
  );
}

function Tienda({ datos, imgs, carrito, setCarrito, avisar, busqueda }) {
  const { catalogo, config } = datos;
  const [cat, setCat] = useState("Todo el catálogo");
  const [orden, setOrden] = useState("relevancia");
  const [cols, setCols] = useState(3);
  const [tope, setTope] = useState(9);
  const [quick, setQuick] = useState(null);
  const [panelFiltros, setPanelFiltros] = useState(false);
  const [f, setF] = useState({ marcas: [], tipos: [], grupos: [], min: "", max: "", soloStock: false });

  const base = useMemo(
    () => catalogo.filter((p) => p.activo && (cat === "Todo el catálogo" || p.cat === cat)),
    [catalogo, cat]
  );

  const lista = useMemo(() => {
    const t = busqueda.trim().toLowerCase();
    let r = base;
    if (t) r = r.filter((p) => [p.marca, p.modelo, p.sku, p.grupo, p.tipo, p.apps].join(" ").toLowerCase().includes(t));
    if (f.marcas.length) r = r.filter((p) => f.marcas.includes(p.marca));
    if (f.tipos.length) r = r.filter((p) => f.tipos.includes(p.tipo));
    if (f.grupos.length) r = r.filter((p) => f.grupos.includes(p.grupo));
    if (f.min) r = r.filter((p) => p.precio >= Number(f.min));
    if (f.max) r = r.filter((p) => p.precio <= Number(f.max));
    if (f.soloStock) r = r.filter((p) => p.stock > 0);
    const s = [...r];
    if (orden === "menor") s.sort((a, b) => a.precio - b.precio);
    else if (orden === "mayor") s.sort((a, b) => b.precio - a.precio);
    else if (orden === "az") s.sort((a, b) => `${a.marca} ${a.modelo}`.localeCompare(`${b.marca} ${b.modelo}`));
    else if (orden === "cca") s.sort((a, b) => b.cca - a.cca);
    else s.sort((a, b) => (b.stock > 0) - (a.stock > 0));
    return s;
  }, [base, busqueda, f, orden]);

  useEffect(() => setTope(9), [cat, busqueda, f, orden]);

  const agregar = (p, cant = 1, canje = false) => {
    setCarrito((c) => {
      const ya = c.find((i) => i.id === p.id);
      if (ya) return c.map((i) => (i.id === p.id ? { ...i, cant: Math.min(p.stock, i.cant + cant) } : i));
      return [...c, { id: p.id, cant: Math.min(p.stock, cant), canje }];
    });
    avisar(`${p.modelo} agregada a la cesta`);
  };
  const enCarrito = (id) => carrito.find((i) => i.id === id)?.cant || 0;

  return (
    <>
      <nav className="catnav">
        <div className="catnav-in">
          {CATEGORIAS.map((c) => (
            <button key={c} className={cat === c ? "on" : ""} onClick={() => setCat(c)}>{c}</button>
          ))}
        </div>
      </nav>

      <section className="collhead">
        <div className="wrap collhead-in">
          <div>
            <div className="eyebrow" style={{ color: "#FFD400" }}>{config.direccion} · {config.horario}</div>
            <h1>{cat === "Todo el catálogo" ? <>Baterías <em>en existencia</em></> : cat}</h1>
            <p>{config.lema}. Busque por marca, grupo BCI o directamente por el modelo de su carro.</p>
          </div>
          <div className="promo">
            <div><b>Instalación</b> sin costo en sucursal</div>
            <div><b>Canje</b> recibimos su batería usada</div>
            <div><b>{config.envio}</b></div>
          </div>
        </div>
      </section>

      <div className="wrap">
        <div className="toolbar">
          <span className="count">{lista.length} {lista.length === 1 ? "producto" : "productos"}</span>
          <button className="btn ghost sm filtbtn" onClick={() => setPanelFiltros(true)}>Filtros</button>
          <div className="density" role="group" aria-label="Densidad de la rejilla">
            <button className={cols === 2 ? "on" : ""} onClick={() => setCols(2)} aria-label="Dos columnas"><i /><i /></button>
            <button className={cols === 3 ? "on" : ""} onClick={() => setCols(3)} aria-label="Tres columnas"><i /><i /><i /></button>
            <button className={cols === 4 ? "on" : ""} onClick={() => setCols(4)} aria-label="Cuatro columnas"><i /><i /><i /><i /></button>
          </div>
          <select className="sel" value={orden} onChange={(e) => setOrden(e.target.value)} aria-label="Ordenar por">
            <option value="relevancia">Disponibles primero</option>
            <option value="menor">Precio, menor a mayor</option>
            <option value="mayor">Precio, mayor a menor</option>
            <option value="cca">Más amperes de arranque</option>
            <option value="az">Alfabéticamente, A-Z</option>
          </select>
        </div>

        <div className="shop" style={{ "--cols": cols }}>
          <aside className="side"><Filtros base={base} f={f} setF={setF} config={config} /></aside>

          <div>
            {lista.length === 0 ? (
              <div className="empty">
                <b>Sin resultados</b>
                Pruebe con el grupo BCI (41, 24F, 65) o con el modelo de su vehículo.
              </div>
            ) : (
              <>
                <div className="grid">
                  {lista.slice(0, tope).map((p) => (
                    <Tarjeta key={p.id} p={p} imgs={imgs} config={config}
                      onAgregar={agregar} onQuick={setQuick} enCarrito={enCarrito(p.id)} />
                  ))}
                </div>
                <div className="more">
                  <p>Ha visto {Math.min(tope, lista.length)} de {lista.length} productos</p>
                  {tope < lista.length && (
                    <button className="btn ghost" onClick={() => setTope((t) => t + 9)}>Mostrar más productos</button>
                  )}
                </div>
              </>
            )}
          </div>
        </div>
      </div>

      {panelFiltros && (
        <>
          <div className="scrim" onClick={() => setPanelFiltros(false)} />
          <aside className="drawer left" role="dialog" aria-label="Filtros">
            <div className="drawer-h">
              <span className="disp" style={{ fontSize: 22 }}>Filtros</span>
              <button className="x" onClick={() => setPanelFiltros(false)} aria-label="Cerrar">×</button>
            </div>
            <div className="drawer-b"><Filtros base={base} f={f} setF={setF} config={config} /></div>
            <div className="drawer-f">
              <button className="btn volt" style={{ width: "100%" }} onClick={() => setPanelFiltros(false)}>
                Mostrar productos ({lista.length})
              </button>
            </div>
          </aside>
        </>
      )}

      {quick && (
        <QuickShop p={quick} imgs={imgs} config={config} onClose={() => setQuick(null)}
          onAgregar={(cant, canje) => { agregar(quick, cant, canje); setQuick(null); }} />
      )}
    </>
  );
}

function QuickShop({ p, imgs, config, onClose, onAgregar }) {
  const [cant, setCant] = useState(1);
  const [canje, setCanje] = useState(false);
  const agotado = p.stock <= 0;
  return (
    <Modal titulo={`${p.marca} ${p.modelo}`} onClose={onClose} ancho={760}
      acciones={<>
        <button className="btn ghost" onClick={onClose}>Seguir viendo</button>
        <button className="btn volt" disabled={agotado} onClick={() => onAgregar(cant, canje)}>
          Agregar {money((canje ? p.canje : p.precio) * cant, config)}
        </button>
      </>}>
      <div className="qs">
        <div className="shot" style={{ background: "var(--shade)" }}><Foto p={p} imgs={imgs} /></div>
        <div>
          <div className="brand">{p.sku}</div>
          <div className="tags">
            <span className="tag">{p.volt}V</span>
            <span className="tag">{p.cca > 0 ? `${p.cca} CCA` : "Ciclo profundo"}</span>
            <span className="tag">{p.ah} Ah</span>
            <span className="tag">Grupo {p.grupo}</span>
            <span className="tag">{p.tipo}</span>
            <span className="tag">{p.garantia} meses de garantía</span>
            {p.pol !== "N/A" && <span className="tag">Positiva a la {p.pol.toLowerCase()}</span>}
          </div>
          <p style={{ fontSize: 13.5, color: "var(--muted)", marginTop: 0 }}>{p.apps}</p>
          <div className="stockline" style={{ marginBottom: 12 }}>
            <Segmentos stock={p.stock} min={p.min} />
            {agotado ? "No disponible en stock" : `${p.stock} en stock`}
          </div>
          <div style={{ fontFamily: "var(--mono)", fontSize: 24, fontWeight: 600 }}>{money(p.precio, config)}</div>
          <label style={{ display: "flex", gap: 7, alignItems: "center", fontSize: 13, margin: "10px 0" }}>
            <input type="checkbox" checked={canje} onChange={(e) => setCanje(e.target.checked)} />
            Entrego mi batería usada y pago {money(p.canje, config)}
          </label>
          {!agotado && (
            <div className="qty" style={{ width: "fit-content" }}>
              <button onClick={() => setCant((c) => Math.max(1, c - 1))} aria-label="Menos">−</button>
              <span>{cant}</span>
              <button onClick={() => setCant((c) => Math.min(p.stock, c + 1))} aria-label="Más">+</button>
            </div>
          )}
        </div>
      </div>
    </Modal>
  );
}

/* ====================== CESTA Y PEDIDO ====================== */

function Cesta({ datos, imgs, carrito, setCarrito, onCerrar, onPedido }) {
  const { catalogo, config } = datos;
  const [paso, setPaso] = useState("cesta");
  const [cliente, setCliente] = useState({ nombre: "", tel: "", entrega: "Recoger en sucursal", dir: "", notas: "" });
  const [folio, setFolio] = useState(null);

  const items = carrito.map((i) => ({ ...i, p: catalogo.find((x) => x.id === i.id) })).filter((i) => i.p);
  const precioDe = (i) => (i.canje ? i.p.canje : i.p.precio);
  const total = items.reduce((s, i) => s + precioDe(i) * i.cant, 0);
  const base = total / (1 + config.iva / 100);

  const cambiar = (id, d) => setCarrito((c) => c.map((i) => (i.id === id ? { ...i, cant: Math.max(1, i.cant + d) } : i)));
  const quitar = (id) => setCarrito((c) => c.filter((i) => i.id !== id));

  const confirmar = () => {
    if (!cliente.nombre.trim() || !cliente.tel.trim()) return;
    const f = onPedido({
      canal: "En línea", estado: "Pendiente", fecha: new Date().toISOString(),
      cliente: { ...cliente }, pago: "Por definir", total,
      items: items.map((i) => ({ id: i.p.id, sku: i.p.sku, nombre: `${i.p.marca} ${i.p.modelo}`, cant: i.cant, precio: precioDe(i), canje: i.canje })),
    });
    setFolio(f); setPaso("listo"); setCarrito([]);
  };

  const msgWA = () => {
    const l = items.map((i) => `• ${i.cant} × ${i.p.marca} ${i.p.modelo}${i.canje ? " (con canje)" : ""}`).join("\n");
    return encodeURIComponent(`Buenas, hice el pedido ${folio} en ${config.negocio}.\n\n${l}\n\nTotal: ${money(total, config)}\n${cliente.entrega}\nNombre: ${cliente.nombre}\nTel: ${cliente.tel}`);
  };

  return (
    <>
      <div className="scrim" onClick={onCerrar} />
      <aside className="drawer" role="dialog" aria-label="Cesta">
        <div className="drawer-h">
          <span className="disp" style={{ fontSize: 22 }}>
            {paso === "cesta" ? "Su cesta" : paso === "datos" ? "Datos de entrega" : "Pedido registrado"}
          </span>
          <button className="x" onClick={onCerrar} aria-label="Cerrar">×</button>
        </div>

        <div className="drawer-b">
          {paso === "cesta" && (items.length === 0 ? (
            <div className="empty"><b>Cesta vacía</b>Agregue una batería del catálogo para continuar.</div>
          ) : items.map((i) => (
            <div className="line" key={i.id}>
              <div className="thumb"><Foto p={i.p} imgs={imgs} /></div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <b style={{ fontSize: 13.5, display: "block" }}>{i.p.marca} {i.p.modelo}</b>
                <div className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>{i.p.sku}</div>
                <label style={{ fontSize: 12, display: "flex", gap: 6, alignItems: "center", marginTop: 5 }}>
                  <input type="checkbox" checked={i.canje}
                    onChange={() => setCarrito((c) => c.map((x) => x.id === i.id ? { ...x, canje: !x.canje } : x))} />
                  Con canje (−{money(i.p.precio - i.p.canje, config)})
                </label>
                <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 7 }}>
                  <div className="qty">
                    <button onClick={() => cambiar(i.id, -1)} aria-label="Menos">−</button>
                    <span>{i.cant}</span>
                    <button onClick={() => cambiar(i.id, 1)} disabled={i.cant >= i.p.stock} aria-label="Más">+</button>
                  </div>
                  <button className="btn ghost sm" onClick={() => quitar(i.id)}>Quitar</button>
                </div>
              </div>
              <div className="mono" style={{ fontWeight: 600, fontSize: 13 }}>{money(precioDe(i) * i.cant, config)}</div>
            </div>
          )))}

          {paso === "datos" && (
            <>
              <Campo label="Nombre completo">
                <input value={cliente.nombre} onChange={(e) => setCliente({ ...cliente, nombre: e.target.value })} placeholder="Ana Rojas" />
              </Campo>
              <Campo label="Teléfono / WhatsApp">
                <input value={cliente.tel} onChange={(e) => setCliente({ ...cliente, tel: e.target.value })} placeholder="8888 1234" />
              </Campo>
              <Campo label="Entrega">
                <select value={cliente.entrega} onChange={(e) => setCliente({ ...cliente, entrega: e.target.value })}>
                  <option>Recoger en sucursal</option>
                  <option>Instalación a domicilio (GAM)</option>
                  <option>Envío por Correos de Costa Rica</option>
                </select>
              </Campo>
              {cliente.entrega !== "Recoger en sucursal" && (
                <Campo label="Dirección exacta">
                  <input value={cliente.dir} onChange={(e) => setCliente({ ...cliente, dir: e.target.value })} placeholder="Provincia, cantón, distrito y señas" />
                </Campo>
              )}
              <Campo label="Vehículo o notas (opcional)">
                <textarea rows={3} value={cliente.notas} onChange={(e) => setCliente({ ...cliente, notas: e.target.value })} placeholder="Hyundai Accent 2018, no arranca desde ayer" />
              </Campo>
              <div className="note" style={{ marginBottom: 0 }}>
                El pago se hace en sucursal o contra entrega. Este prototipo todavía no cobra en línea.
              </div>
            </>
          )}

          {paso === "listo" && (
            <div style={{ textAlign: "center", padding: "22px 0" }}>
              <div className="eyebrow">Número de pedido</div>
              <div className="disp" style={{ fontSize: 46, margin: "8px 0 14px" }}>{folio}</div>
              <p style={{ color: "var(--muted)", fontSize: 14 }}>
                Su pedido ya está en la lista del mostrador. Le confirmamos disponibilidad por WhatsApp
                y la batería se aparta una vez confirmada.
              </p>
              <a className="btn volt" style={{ display: "inline-block", textDecoration: "none", marginTop: 10 }}
                href={`https://wa.me/${config.whatsapp}?text=${msgWA()}`} target="_blank" rel="noopener noreferrer">
                Enviar pedido por WhatsApp
              </a>
            </div>
          )}
        </div>

        {paso !== "listo" && items.length > 0 && (
          <div className="drawer-f">
            <div className="tot"><span>Subtotal sin IVA</span><span>{money(base, config)}</span></div>
            <div className="tot"><span>IVA {config.iva}%</span><span>{money(total - base, config)}</span></div>
            <div className="tot big"><span>Total</span><span>{money(total, config)}</span></div>
            <div style={{ display: "flex", gap: 9, marginTop: 13 }}>
              {paso === "datos" && <button className="btn ghost" onClick={() => setPaso("cesta")}>Regresar</button>}
              <button className="btn volt" style={{ flex: 1 }}
                disabled={paso === "datos" && (!cliente.nombre.trim() || !cliente.tel.trim())}
                onClick={() => (paso === "cesta" ? setPaso("datos") : confirmar())}>
                {paso === "cesta" ? "Continuar" : "Confirmar pedido"}
              </button>
            </div>
          </div>
        )}
        {paso === "listo" && (
          <div className="drawer-f">
            <button className="btn" style={{ width: "100%" }} onClick={onCerrar}>Seguir viendo el catálogo</button>
          </div>
        )}
      </aside>
    </>
  );
}

/* ====================== ACCESO ====================== */

function Acceso({ config, onEntrar, onSalir }) {
  const [clave, setClave] = useState("");
  const [error, setError] = useState("");
  const ref = useRef(null);
  useEffect(() => ref.current?.focus(), []);
  const entrar = () => {
    if (hash(clave) === (config.claveHash || hash(config.clavePlaceholder))) onEntrar();
    else { setError("Contraseña incorrecta."); setClave(""); }
  };
  return (
    <div className="wrap" style={{ maxWidth: 440, padding: "58px 20px" }}>
      <div className="eyebrow">Área restringida</div>
      <h2 className="disp" style={{ fontSize: 40, margin: "8px 0 18px" }}>Panel de<br />administración</h2>
      <div className="panel" style={{ marginTop: 0 }}>
        <Campo label="Contraseña">
          <input ref={ref} type="password" value={clave} placeholder="••••••••"
            onChange={(e) => { setClave(e.target.value); setError(""); }}
            onKeyDown={(e) => e.key === "Enter" && entrar()} />
        </Campo>
        {error && <div style={{ color: "var(--pos)", fontSize: 12.5, marginBottom: 10 }}>{error}</div>}
        <div style={{ display: "flex", gap: 9 }}>
          <button className="btn volt" style={{ flex: 1 }} onClick={entrar}>Entrar</button>
          <button className="btn ghost" onClick={onSalir}>Volver a la tienda</button>
        </div>
        <p className="mono" style={{ fontSize: 11.5, color: "var(--muted)", margin: "14px 0 0" }}>
          Prototipo · contraseña inicial: {config.clavePlaceholder}
        </p>
      </div>
      <div className="note" style={{ marginTop: 16 }}>
        <b>Sobre la seguridad:</b> esta validación ocurre en el navegador, así que demuestra el flujo
        pero no protege datos reales. La versión de producción necesita servidor, contraseñas cifradas y sesiones.
      </div>
    </div>
  );
}

/* ====================== INVENTARIO ====================== */

const VACIO = {
  sku: "", marca: "", modelo: "", cat: "Automotriz", grupo: "", volt: 12, cca: 0, ah: 0,
  tipo: "Libre mantenimiento", pol: "Derecha", garantia: 12, img: "",
  precio: 0, canje: 0, costo: 0, stock: 0, min: 2, apps: "", activo: true,
};

function Inventario({ datos, setDatos, imgs, setImgs, avisar }) {
  const { catalogo, config } = datos;
  const [q, setQ] = useState("");
  const [edit, setEdit] = useState(null);
  const [editImg, setEditImg] = useState(null); // dataURL provisional
  const [borrar, setBorrar] = useState(null);
  const fileRef = useRef(null);

  const lista = useMemo(() => {
    const t = q.trim().toLowerCase();
    return t ? catalogo.filter((p) => [p.sku, p.marca, p.modelo, p.grupo, p.apps].join(" ").toLowerCase().includes(t)) : catalogo;
  }, [catalogo, q]);

  const abrir = (p) => { setEdit(p ? { ...p } : { ...VACIO }); setEditImg(p ? (imgs[p.id] || null) : null); };

  const subir = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    if (file.size > 8 * 1024 * 1024) return avisar("La foto pesa más de 8 MB");
    try { setEditImg(await comprimirImagen(file)); }
    catch { avisar("No se pudo leer la foto"); }
    e.target.value = "";
  };

  const guardar = () => {
    const p = { ...edit };
    ["volt", "cca", "ah", "garantia", "precio", "canje", "costo", "stock", "min"].forEach((k) => (p[k] = Number(p[k]) || 0));
    if (!p.marca.trim() || !p.modelo.trim()) return avisar("Falta la marca o el modelo");
    if (!p.sku.trim()) p.sku = `${p.marca.slice(0, 3).toUpperCase()}-${p.grupo || "GEN"}-${p.cca || p.ah}`;
    const id = p.id || nuevoId();
    setDatos((d) => ({ ...d, catalogo: p.id ? d.catalogo.map((x) => (x.id === id ? p : x)) : [...d.catalogo, { ...p, id }] }));
    setImgs((m) => { const n = { ...m }; if (editImg) n[id] = editImg; else delete n[id]; return n; });
    avisar(p.id ? "Cambios guardados" : "Producto agregado");
    setEdit(null); setEditImg(null);
  };

  const ajustar = (id, d) =>
    setDatos((s) => ({ ...s, catalogo: s.catalogo.map((p) => (p.id === id ? { ...p, stock: Math.max(0, p.stock + d) } : p)) }));

  const eliminar = () => {
    setDatos((d) => ({ ...d, catalogo: d.catalogo.filter((p) => p.id !== borrar.id) }));
    setImgs((m) => { const n = { ...m }; delete n[borrar.id]; return n; });
    avisar("Producto eliminado"); setBorrar(null);
  };

  const exportar = () => descargarCSV("inventario.csv", [
    ["SKU", "Marca", "Modelo", "Categoría", "Grupo", "Volt", "CCA", "Ah", "Tipo", "Polaridad", "Garantía", "Costo", "Precio", "Canje", "Stock", "Mínimo", "Activo"],
    ...catalogo.map((p) => [p.sku, p.marca, p.modelo, p.cat, p.grupo, p.volt, p.cca, p.ah, p.tipo, p.pol, p.garantia, p.costo, p.precio, p.canje, p.stock, p.min, p.activo ? "Sí" : "No"]),
  ]);

  return (
    <>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center" }}>
        <input type="search" value={q} onChange={(e) => setQ(e.target.value)}
          placeholder="Buscar por SKU, marca, grupo o vehículo"
          style={{ flex: "1 1 240px", padding: "10px 12px", border: "1px solid var(--line)", borderRadius: 2 }} />
        <button className="btn ghost" onClick={exportar}>Exportar CSV</button>
        <button className="btn volt" onClick={() => abrir(null)}>Agregar producto</button>
      </div>

      <div className="panel scroll">
        <table>
          <thead><tr><th></th><th>Producto</th><th>Categoría</th><th className="num">Costo</th><th className="num">Precio</th><th className="num">Margen</th><th>Existencia</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {lista.map((p) => {
              const margen = p.precio > 0 ? ((p.precio - p.costo) / p.precio) * 100 : 0;
              return (
                <tr key={p.id}>
                  <td><div className="minithumb"><Foto p={p} imgs={imgs} /></div></td>
                  <td>
                    <b>{p.marca} {p.modelo}</b>
                    <div className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>{p.sku} · grupo {p.grupo}</div>
                  </td>
                  <td style={{ fontSize: 12.5, color: "var(--muted)" }}>{p.cat}</td>
                  <td className="num">{money(p.costo, config)}</td>
                  <td className="num">{money(p.precio, config)}</td>
                  <td className="num" style={{ color: margen < 20 ? "var(--pos)" : "var(--ok)" }}>{margen.toFixed(0)}%</td>
                  <td>
                    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <div className="qty">
                        <button onClick={() => ajustar(p.id, -1)} aria-label="Restar">−</button>
                        <span>{p.stock}</span>
                        <button onClick={() => ajustar(p.id, 1)} aria-label="Sumar">+</button>
                      </div>
                      {p.stock === 0 ? <span className="badge bad">Agotado</span> : p.stock <= p.min ? <span className="badge warn">Bajo</span> : null}
                    </div>
                  </td>
                  <td>
                    <button className={`badge ${p.activo ? "ok" : "neu"}`} style={{ background: "none", cursor: "pointer" }}
                      onClick={() => setDatos((d) => ({ ...d, catalogo: d.catalogo.map((x) => x.id === p.id ? { ...x, activo: !x.activo } : x) }))}>
                      {p.activo ? "Publicado" : "Oculto"}
                    </button>
                  </td>
                  <td style={{ whiteSpace: "nowrap" }}>
                    <button className="btn ghost sm" onClick={() => abrir(p)}>Editar</button>{" "}
                    <button className="btn danger sm" onClick={() => setBorrar(p)}>Eliminar</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
        {lista.length === 0 && <div className="empty"><b>Sin coincidencias</b>Ajuste la búsqueda o agregue un producto nuevo.</div>}
      </div>

      {edit && (
        <Modal titulo={edit.id ? "Editar producto" : "Nuevo producto"} onClose={() => setEdit(null)} ancho={760}
          acciones={<>
            <button className="btn ghost" onClick={() => setEdit(null)}>Cancelar</button>
            <button className="btn volt" onClick={guardar}>Guardar producto</button>
          </>}>

          <div style={{ display: "flex", gap: 16, marginBottom: 16, flexWrap: "wrap" }}>
            <div className="shot" style={{ width: 190, aspectRatio: "1/.9", background: "var(--shade)", border: "1px solid var(--line)", borderRadius: 2, flex: "none" }}>
              {editImg ? <img src={editImg} alt="Vista previa" /> : <Foto p={{ ...edit, id: "__prev" }} imgs={{}} />}
            </div>
            <div style={{ flex: "1 1 240px", minWidth: 0 }}>
              <div className="eyebrow">Foto del producto</div>
              <p style={{ fontSize: 12.5, color: "var(--muted)", margin: "6px 0 10px" }}>
                Suba una foto o pegue una dirección de imagen. Sin foto se usa la ilustración automática.
                Use fotos propias o del fabricante con permiso.
              </p>
              <input ref={fileRef} type="file" accept="image/*" onChange={subir} style={{ display: "none" }} />
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                <button className="btn ghost sm" onClick={() => fileRef.current?.click()}>Subir foto</button>
                {editImg && <button className="btn danger sm" onClick={() => setEditImg(null)}>Quitar foto</button>}
              </div>
              <Campo label="O dirección de imagen (URL)">
                <input value={edit.img} onChange={(e) => setEdit({ ...edit, img: e.target.value })} placeholder="https://…/bateria.jpg" />
              </Campo>
            </div>
          </div>

          <div className="cols">
            <Campo label="Marca"><input value={edit.marca} onChange={(e) => setEdit({ ...edit, marca: e.target.value })} /></Campo>
            <Campo label="Modelo"><input value={edit.modelo} onChange={(e) => setEdit({ ...edit, modelo: e.target.value })} /></Campo>
          </div>
          <div className="cols3">
            <Campo label="SKU (automático si lo deja vacío)"><input value={edit.sku} onChange={(e) => setEdit({ ...edit, sku: e.target.value })} /></Campo>
            <Campo label="Categoría">
              <select value={edit.cat} onChange={(e) => setEdit({ ...edit, cat: e.target.value })}>
                {CATEGORIAS.slice(1).map((c) => <option key={c}>{c}</option>)}
              </select>
            </Campo>
            <Campo label="Grupo BCI"><input value={edit.grupo} onChange={(e) => setEdit({ ...edit, grupo: e.target.value })} /></Campo>
          </div>
          <div className="cols3">

            <Campo label="CCA"><input type="number" value={edit.cca} onChange={(e) => setEdit({ ...edit, cca: e.target.value })} /></Campo>
            <Campo label="Amperes hora"><input type="number" value={edit.ah} onChange={(e) => setEdit({ ...edit, ah: e.target.value })} /></Campo>
          </div>
          <div className="cols3">
            <Campo label="Tipo">

            <Campo label="Garantía (meses)"><input type="number" value={edit.garantia} onChange={(e) => setEdit({ ...edit, garantia: e.target.value })} /></Campo>
          </div>
          <div className="cols3">
            <Campo label="Costo"><input type="number" value={edit.costo} onChange={(e) => setEdit({ ...edit, costo: e.target.value })} /></Campo>
            <Campo label="Precio público"><input type="number" value={edit.precio} onChange={(e) => setEdit({ ...edit, precio: e.target.value })} /></Campo>
            <Campo label="Precio con canje"><input type="number" value={edit.canje} onChange={(e) => setEdit({ ...edit, canje: e.target.value })} /></Campo>

            <Campo label="Mínimo antes de resurtir"><input type="number" value={edit.min} onChange={(e) => setEdit({ ...edit, min: e.target.value })} /></Campo>

            Va a eliminar <b>{borrar.marca} {borrar.modelo}</b> del catálogo. Las ventas ya registradas

/* ====================== PUNTO DE VENTA ====================== */

function PuntoVenta({ datos, setDatos, imgs, avisar }) {
  const { catalogo, config } = datos;
  const [q, setQ] = useState("");
  const [lineas, setLineas] = useState([]);
  const [desc, setDesc] = useState(0);
  const [pago, setPago] = useState("Efectivo");
  const [cliente, setCliente] = useState("");
  const [ticket, setTicket] = useState(null);

  const sugerencias = useMemo(() => {
    const t = q.trim().toLowerCase();
    if (!t) return [];
    return catalogo.filter((p) => p.stock > 0 && [p.sku, p.marca, p.modelo, p.grupo, p.apps].join(" ").toLowerCase().includes(t)).slice(0, 6);
  }, [catalogo, q]);

  const agregar = (p) => {
    setLineas((l) => {
      const ya = l.find((x) => x.id === p.id);
      if (ya) return l.map((x) => (x.id === p.id ? { ...x, cant: Math.min(p.stock, x.cant + 1) } : x));
      return [...l, { id: p.id, cant: 1, canje: false }];
    });
    setQ("");
  };

  const items = lineas.map((l) => ({ ...l, p: catalogo.find((x) => x.id === l.id) })).filter((l) => l.p);
  const bruto = items.reduce((s, i) => s + (i.canje ? i.p.canje : i.p.precio) * i.cant, 0);
  const total = Math.max(0, bruto - Number(desc || 0));
  const base = total / (1 + config.iva / 100);
  const costo = items.reduce((s, i) => s + i.p.costo * i.cant, 0);

  const cobrar = () => {
    if (!items.length) return;
    const folio = `V-${String(datos.consec.venta).padStart(4, "0")}`;
    const venta = {
      folio, canal: "Mostrador", estado: "Pagada", fecha: new Date().toISOString(),
      cliente: { nombre: cliente || "Cliente de mostrador", tel: "", entrega: "Mostrador", dir: "", notas: "" },
      pago, descuento: Number(desc || 0), total, costo,
      items: items.map((i) => ({ id: i.p.id, sku: i.p.sku, nombre: `${i.p.marca} ${i.p.modelo}`, cant: i.cant, precio: i.canje ? i.p.canje : i.p.precio, canje: i.canje })),
    };
    setDatos((d) => ({
      ...d,
      ventas: [venta, ...d.ventas],
      consec: { ...d.consec, venta: d.consec.venta + 1 },
      catalogo: d.catalogo.map((p) => {
        const it = venta.items.find((i) => i.id === p.id);
        return it ? { ...p, stock: Math.max(0, p.stock - it.cant) } : p;
      }),
    }));
    setTicket(venta); setLineas([]); setDesc(0); setCliente("");
    avisar(`Venta ${folio} registrada`);
  };

  return (
    <>
      <div className="panel" style={{ marginTop: 0 }}>
        <Campo label="Buscar producto por SKU, marca, grupo o vehículo">
          <input value={q} onChange={(e) => setQ(e.target.value)} placeholder="Escriba para buscar…" />
        </Campo>
        {sugerencias.length > 0 && (
          <div style={{ border: "1px solid var(--line)", borderRadius: 2, marginBottom: 12 }}>
            {sugerencias.map((p) => (
              <button key={p.id} onClick={() => agregar(p)}
                style={{ display: "flex", width: "100%", alignItems: "center", gap: 10, padding: "9px 12px", border: "none", borderBottom: "1px solid var(--line2)", background: "#fff", textAlign: "left" }}>
                <div className="minithumb"><Foto p={p} imgs={imgs} /></div>
                <span style={{ flex: 1 }}>
                  <b>{p.marca} {p.modelo}</b>{" "}
                  <span className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>{p.sku} · {p.stock} pz</span>
                </span>
                <span className="mono">{money(p.precio, config)}</span>
              </button>
            ))}
          </div>
        )}

        {items.length === 0 ? (
          <div className="empty"><b>Factura vacía</b>Busque el producto y agréguelo para empezar a cobrar.</div>
        ) : (
          <div className="scroll">
            <table>
              <thead><tr><th>Producto</th><th>Canje</th><th>Cantidad</th><th className="num">Unitario</th><th className="num">Importe</th><th></th></tr></thead>
              <tbody>
                {items.map((i) => (
                  <tr key={i.id}>
                    <td><b>{i.p.marca} {i.p.modelo}</b><div className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>{i.p.sku}</div></td>
                    <td><input type="checkbox" checked={i.canje} onChange={() => setLineas((l) => l.map((x) => x.id === i.id ? { ...x, canje: !x.canje } : x))} /></td>
                    <td>
                      <div className="qty">
                        <button onClick={() => setLineas((l) => l.map((x) => x.id === i.id ? { ...x, cant: Math.max(1, x.cant - 1) } : x))}>−</button>
                        <span>{i.cant}</span>
                        <button disabled={i.cant >= i.p.stock} onClick={() => setLineas((l) => l.map((x) => x.id === i.id ? { ...x, cant: Math.min(i.p.stock, x.cant + 1) } : x))}>+</button>
                      </div>
                    </td>
                    <td className="num">{money(i.canje ? i.p.canje : i.p.precio, config)}</td>
                    <td className="num">{money((i.canje ? i.p.canje : i.p.precio) * i.cant, config)}</td>
                    <td><button className="btn ghost sm" onClick={() => setLineas((l) => l.filter((x) => x.id !== i.id))}>Quitar</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {items.length > 0 && (
        <div className="panel">
          <div className="cols3">
            <Campo label="Cliente (opcional)"><input value={cliente} onChange={(e) => setCliente(e.target.value)} placeholder="Cliente de mostrador" /></Campo>
            <Campo label="Descuento"><input type="number" value={desc} onChange={(e) => setDesc(e.target.value)} /></Campo>
            <Campo label="Forma de pago">
              <select value={pago} onChange={(e) => setPago(e.target.value)}>
                <option>Efectivo</option><option>Tarjeta</option><option>SINPE Móvil</option><option>Transferencia</option><option>Crédito de la casa</option>
              </select>
            </Campo>
          </div>
          <div style={{ maxWidth: 330, marginLeft: "auto" }}>
            <div className="tot"><span>Bruto</span><span>{money(bruto, config)}</span></div>
            <div className="tot"><span>Descuento</span><span>−{money(desc || 0, config)}</span></div>
            <div className="tot"><span>Base sin IVA</span><span>{money(base, config)}</span></div>
            <div className="tot"><span>IVA {config.iva}%</span><span>{money(total - base, config)}</span></div>
            <div className="tot big"><span>Total</span><span>{money(total, config)}</span></div>
            <div className="tot" style={{ color: "var(--ok)" }}><span>Utilidad estimada</span><span>{money(total - costo, config)}</span></div>
            <button className="btn volt" style={{ width: "100%", marginTop: 12, padding: 14, fontSize: 15 }} onClick={cobrar}>
              Cobrar {money(total, config)}
            </button>
          </div>
        </div>
      )}

      {ticket && (
        <Modal titulo={`Venta ${ticket.folio}`} onClose={() => setTicket(null)}
          acciones={<button className="btn volt" onClick={() => setTicket(null)}>Listo</button>}>
          <div className="mono" style={{ fontSize: 13 }}>
            <div style={{ marginBottom: 10 }}>{fechaCorta(ticket.fecha)} · {ticket.pago} · {ticket.cliente.nombre}</div>
            {ticket.items.map((i, n) => (
              <div key={n} style={{ display: "flex", justifyContent: "space-between", padding: "4px 0", borderBottom: "1px dotted var(--line)" }}>
                <span>{i.cant} × {i.nombre}{i.canje ? " (canje)" : ""}</span>
                <span>{money(i.precio * i.cant, config)}</span>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, fontSize: 18, fontWeight: 600 }}>
              <span>Total</span><span>{money(ticket.total, config)}</span>
            </div>
          </div>
          <p style={{ fontSize: 12.5, color: "var(--muted)", marginTop: 14, marginBottom: 0 }}>
            El inventario ya se descontó. Recuerde registrar la batería usada si el cliente la entregó a canje.
          </p>
        </Modal>
      )}
    </>
  );
}

/* ====================== VENTAS Y PEDIDOS ====================== */

function Ventas({ datos, setDatos, avisar }) {
  const { ventas, config } = datos;
  const [filtro, setFiltro] = useState("Todas");
  const [detalle, setDetalle] = useState(null);

  const lista = ventas.filter((v) =>
    filtro === "Todas" ? true : filtro === "Pendientes" ? v.estado === "Pendiente" : v.canal === filtro);

  const confirmar = (v) => {
    const falta = v.items.find((i) => {
      const p = datos.catalogo.find((x) => x.id === i.id);
      return !p || p.stock < i.cant;
    });
    if (falta) return avisar(`Sin existencia suficiente de ${falta.nombre}`);
    setDatos((d) => ({
      ...d,
      ventas: d.ventas.map((x) => (x.folio === v.folio ? { ...x, estado: "Confirmado" } : x)),
      catalogo: d.catalogo.map((p) => {
        const it = v.items.find((i) => i.id === p.id);
        return it ? { ...p, stock: Math.max(0, p.stock - it.cant) } : p;
      }),
    }));
    avisar(`${v.folio} confirmado, inventario descontado`);
    setDetalle(null);
  };

  const cancelar = (v) => {
    setDatos((d) => ({
      ...d,
      ventas: d.ventas.map((x) => (x.folio === v.folio ? { ...x, estado: "Cancelado" } : x)),
      catalogo: v.estado === "Pendiente" ? d.catalogo : d.catalogo.map((p) => {
        const it = v.items.find((i) => i.id === p.id);
        return it ? { ...p, stock: p.stock + it.cant } : p;
      }),
    }));
    avisar(`${v.folio} cancelado`); setDetalle(null);
  };

  const exportar = () => descargarCSV("ventas.csv", [
    ["Folio", "Fecha", "Canal", "Estado", "Cliente", "Teléfono", "Entrega", "Pago", "Piezas", "Total"],
    ...ventas.map((v) => [v.folio, v.fecha, v.canal, v.estado, v.cliente?.nombre, v.cliente?.tel, v.cliente?.entrega, v.pago, v.items.reduce((s, i) => s + i.cant, 0), v.total]),
  ]);

  const badge = (e) => (e === "Pagada" || e === "Confirmado" ? "ok" : e === "Pendiente" ? "warn" : "bad");

  return (
    <>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        {["Todas", "Pendientes", "Mostrador", "En línea"].map((x) => (
          <button key={x} className={`chip${filtro === x ? " on" : ""}`} onClick={() => setFiltro(x)}>{x}</button>
        ))}
        <button className="btn ghost" style={{ marginLeft: "auto" }} onClick={exportar}>Exportar CSV</button>
      </div>

      <div className="panel scroll">
        <table>
          <thead><tr><th>Folio</th><th>Fecha</th><th>Canal</th><th>Cliente</th><th className="num">Piezas</th><th className="num">Total</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {lista.map((v) => (
              <tr key={v.folio}>
                <td className="mono"><b>{v.folio}</b></td>
                <td style={{ fontSize: 12.5, color: "var(--muted)" }}>{fechaCorta(v.fecha)}</td>
                <td>{v.canal}</td>
                <td>{v.cliente?.nombre}<div style={{ fontSize: 11.5, color: "var(--muted)" }}>{v.cliente?.tel}</div></td>
                <td className="num">{v.items.reduce((s, i) => s + i.cant, 0)}</td>
                <td className="num"><b>{money(v.total, config)}</b></td>
                <td><span className={`badge ${badge(v.estado)}`}>{v.estado}</span></td>
                <td><button className="btn ghost sm" onClick={() => setDetalle(v)}>Ver</button></td>
              </tr>
            ))}
          </tbody>
        </table>
        {lista.length === 0 && <div className="empty"><b>Nada por aquí</b>Cuando entren pedidos o registre ventas, aparecerán en esta lista.</div>}
      </div>

      {detalle && (
        <Modal titulo={`${detalle.folio} · ${detalle.canal}`} onClose={() => setDetalle(null)}
          acciones={<>
            {detalle.estado === "Pendiente" && <button className="btn volt" onClick={() => confirmar(detalle)}>Confirmar y descontar</button>}
            {detalle.estado !== "Cancelado" && <button className="btn danger" onClick={() => cancelar(detalle)}>Cancelar pedido</button>}
            <button className="btn ghost" onClick={() => setDetalle(null)}>Cerrar</button>
          </>}>
          <div style={{ marginBottom: 14, fontSize: 13.5 }}>
            <div><b>{detalle.cliente?.nombre}</b> · {detalle.cliente?.tel}</div>
            <div style={{ color: "var(--muted)" }}>{detalle.cliente?.entrega}{detalle.cliente?.dir ? ` — ${detalle.cliente.dir}` : ""}</div>
            {detalle.cliente?.notas && <div style={{ color: "var(--muted)", marginTop: 6 }}>Nota: {detalle.cliente.notas}</div>}
          </div>
          <div className="mono" style={{ fontSize: 13 }}>
            {detalle.items.map((i, n) => (
              <div key={n} style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderBottom: "1px dotted var(--line)" }}>
                <span>{i.cant} × {i.nombre}{i.canje ? " (canje)" : ""}</span>
                <span>{money(i.precio * i.cant, config)}</span>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, fontSize: 18, fontWeight: 600 }}>
              <span>Total</span><span>{money(detalle.total, config)}</span>
            </div>
          </div>
          {detalle.cliente?.tel && (
            <a className="btn ghost" style={{ display: "inline-block", marginTop: 14, textDecoration: "none" }}
              href={`https://wa.me/${detalle.cliente.tel.replace(/\D/g, "")}`} target="_blank" rel="noopener noreferrer">
              Escribir al cliente
            </a>
          )}
        </Modal>
      )}
    </>
  );
}

/* ====================== RESUMEN ====================== */

function Resumen({ datos, irA }) {
  const { catalogo, ventas, config } = datos;
  const hoy = hoyISO(), mes = hoy.slice(0, 7);
  const validas = ventas.filter((v) => v.estado === "Pagada" || v.estado === "Confirmado");
  const delDia = validas.filter((v) => v.fecha.slice(0, 10) === hoy);
  const delMes = validas.filter((v) => v.fecha.slice(0, 7) === mes);
  const pendientes = ventas.filter((v) => v.estado === "Pendiente");
  const bajos = catalogo.filter((p) => p.activo && p.stock <= p.min);

  return (
    <>
      <div className="kpis">
        <div className="kpi"><small>Vendido hoy</small><b>{money(delDia.reduce((s, v) => s + v.total, 0), config)}</b><small>{delDia.length} operaciones</small></div>
        <div className="kpi"><small>Vendido este mes</small><b>{money(delMes.reduce((s, v) => s + v.total, 0), config)}</b><small>{delMes.length} operaciones</small></div>
        <div className="kpi"><small>Pedidos por confirmar</small><b>{pendientes.length}</b><small>llegados de la tienda</small></div>
        <div className="kpi"><small>Inventario a precio de venta</small><b>{money(catalogo.reduce((s, p) => s + p.precio * p.stock, 0), config)}</b><small>costo {money(catalogo.reduce((s, p) => s + p.costo * p.stock, 0), config)}</small></div>
        <div className="kpi"><small>Piezas en piso</small><b>{catalogo.reduce((s, p) => s + p.stock, 0)}</b><small>{catalogo.length} modelos</small></div>
        <div className="kpi"><small>Por resurtir</small><b>{bajos.length}</b><small>en o bajo el mínimo</small></div>
      </div>

      {pendientes.length > 0 && (
        <div className="panel">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <span className="disp" style={{ fontSize: 20 }}>Pedidos esperando respuesta</span>
            <button className="btn ghost sm" onClick={() => irA("ventas")}>Ver todos</button>
          </div>
          {pendientes.slice(0, 5).map((v) => (
            <div key={v.folio} style={{ display: "flex", justifyContent: "space-between", gap: 10, padding: "9px 0", borderBottom: "1px solid var(--line2)", fontSize: 13.5 }}>
              <span><b className="mono">{v.folio}</b> · {v.cliente?.nombre} <span style={{ color: "var(--muted)" }}>({v.cliente?.entrega})</span></span>
              <span className="mono">{money(v.total, config)}</span>
            </div>
          ))}
        </div>
      )}

      <div className="panel">
        <span className="disp" style={{ fontSize: 20 }}>Lista de resurtido</span>
        {bajos.length === 0 ? (
          <p style={{ color: "var(--muted)", fontSize: 13.5, marginBottom: 0 }}>Todo por encima del mínimo. Nada urgente que pedir al proveedor.</p>
        ) : (
          <div className="scroll" style={{ marginTop: 8 }}>
            <table>
              <thead><tr><th>Producto</th><th className="num">Existencia</th><th className="num">Mínimo</th><th className="num">Sugerido pedir</th></tr></thead>
              <tbody>
                {bajos.map((p) => (
                  <tr key={p.id}>
                    <td><b>{p.marca} {p.modelo}</b> <span className="mono" style={{ fontSize: 11, color: "var(--muted)" }}>{p.sku}</span></td>
                    <td className="num" style={{ color: p.stock === 0 ? "var(--pos)" : "var(--warn)" }}>{p.stock}</td>
                    <td className="num">{p.min}</td>
                    <td className="num"><b>{Math.max(p.min * 2 - p.stock, 1)}</b></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </>
  );
}

/* ====================== AJUSTES ====================== */

function Ajustes({ datos, setDatos, imgs, avisar, onReset }) {
  const [c, setC] = useState(datos.config);
  const [nueva, setNueva] = useState("");
  const [confirmar, setConfirmar] = useState(false);
  const pesoFotos = Math.round(JSON.stringify(imgs).length / 1024);

  const guardar = () => {
    const cfg = { ...c, iva: Number(c.iva) || 0 };
    if (nueva.trim().length >= 4) { cfg.claveHash = hash(nueva.trim()); cfg.clavePlaceholder = "la que definió"; }
    setDatos((d) => ({ ...d, config: cfg }));
    setNueva(""); avisar("Ajustes guardados");
  };

  return (
    <>
      <div className="panel" style={{ marginTop: 0 }}>
        <span className="disp" style={{ fontSize: 20 }}>Datos del negocio</span>
        <div className="cols" style={{ marginTop: 12 }}>
          <Campo label="Nombre"><input value={c.negocio} onChange={(e) => setC({ ...c, negocio: e.target.value })} /></Campo>
          <Campo label="Lema o promesa"><input value={c.lema} onChange={(e) => setC({ ...c, lema: e.target.value })} /></Campo>
        </div>
        <div className="cols">
          <Campo label="Dirección"><input value={c.direccion} onChange={(e) => setC({ ...c, direccion: e.target.value })} /></Campo>
          <Campo label="Horario"><input value={c.horario} onChange={(e) => setC({ ...c, horario: e.target.value })} /></Campo>
        </div>
        <Campo label="Mensaje de envío"><input value={c.envio} onChange={(e) => setC({ ...c, envio: e.target.value })} /></Campo>
        <div className="cols3">
          <Campo label="WhatsApp (solo dígitos, con código de país)"><input value={c.whatsapp} onChange={(e) => setC({ ...c, whatsapp: e.target.value })} /></Campo>
          <Campo label="Símbolo de moneda"><input value={c.moneda} onChange={(e) => setC({ ...c, moneda: e.target.value })} /></Campo>
          <Campo label="IVA %"><input type="number" value={c.iva} onChange={(e) => setC({ ...c, iva: e.target.value })} /></Campo>
        </div>
      </div>

      <div className="panel">
        <span className="disp" style={{ fontSize: 20 }}>Contraseña del panel</span>
        <Campo label="Nueva contraseña (mínimo 4 caracteres)">
          <input type="password" value={nueva} onChange={(e) => setNueva(e.target.value)} placeholder="Déjela vacía para no cambiarla" />
        </Campo>
        <div className="note" style={{ marginBottom: 0 }}>
          Se guarda ofuscada en el navegador, no cifrada en un servidor. Sirve para el prototipo;
          no la use como única protección con datos reales de clientes.
        </div>
      </div>

      <div className="panel">
        <span className="disp" style={{ fontSize: 20 }}>Fotos guardadas</span>
        <p style={{ fontSize: 13.5, color: "var(--muted)", margin: "8px 0 0" }}>
          {Object.keys(imgs).length} fotos ocupan cerca de {pesoFotos} KB. Cada foto se reduce a 620 px
          al subirla. Si se acerca a 4.000 KB conviene usar direcciones de imagen en lugar de archivos.
        </p>
      </div>

      <div style={{ display: "flex", gap: 9, marginTop: 16, flexWrap: "wrap" }}>
        <button className="btn volt" onClick={guardar}>Guardar ajustes</button>
        <button className="btn danger" onClick={() => setConfirmar(true)}>Restablecer datos de ejemplo</button>
      </div>

      {confirmar && (
        <Modal titulo="Restablecer todo" onClose={() => setConfirmar(false)}
          acciones={<>
            <button className="btn ghost" onClick={() => setConfirmar(false)}>Cancelar</button>
            <button className="btn danger" onClick={() => { onReset(); setConfirmar(false); }}>Sí, restablecer</button>
          </>}>
          <p style={{ margin: 0 }}>Se borran el inventario, las fotos, las ventas y los ajustes, y vuelve el catálogo de ejemplo. No se puede deshacer.</p>
        </Modal>
      )}
    </>
  );
}

/* ====================== APP ====================== */

function App() {
  const [datos, setDatos] = useState(null);
  const [imgs, setImgs] = useState({});
  const [cargando, setCargando] = useState(true);
  const [errorGuardado, setErrorGuardado] = useState(false);
  const [vista, setVista] = useState("tienda");
  const [tab, setTab] = useState("resumen");
  const [auth, setAuth] = useState(false);
  const [carrito, setCarrito] = useState([]);
  const [cestaAbierta, setCestaAbierta] = useState(false);
  const [busqueda, setBusqueda] = useState("");
  const [toast, setToast] = useState("");

  const inicial = () => ({
    catalogo: SEED_CATALOGO.map((p) => ({ ...p })),
    ventas: [], config: { ...CONFIG_INICIAL }, consec: { venta: 1, pedido: 1 },
  });

  const avisar = (m) => { setToast(m); setTimeout(() => setToast(""), 2400); };

  useEffect(() => {
    (async () => {
      let d = null, m = {};
      try { const r = await window.storage.get(KEY_DATOS); d = r ? JSON.parse(r.value) : null; } catch { d = null; }
      try { const r = await window.storage.get(KEY_IMGS); m = r ? JSON.parse(r.value) : {}; } catch { m = {}; }
      setDatos(d || inicial()); setImgs(m); setCargando(false);
    })();
  }, []);

  useEffect(() => {
    if (!datos || cargando) return;
    const t = setTimeout(async () => {
      try { await window.storage.set(KEY_DATOS, JSON.stringify(datos)); setErrorGuardado(false); }
      catch { setErrorGuardado(true); }
    }, 500);
    return () => clearTimeout(t);
  }, [datos, cargando]);

  useEffect(() => {
    if (cargando) return;
    const t = setTimeout(async () => {
      try { await window.storage.set(KEY_IMGS, JSON.stringify(imgs)); }
      catch { setErrorGuardado(true); }
    }, 700);
    return () => clearTimeout(t);
  }, [imgs, cargando]);

  const registrarPedido = (pedido) => {
    const folio = `P-${String(datos.consec.pedido).padStart(4, "0")}`;
    setDatos((d) => ({ ...d, ventas: [{ ...pedido, folio }, ...d.ventas], consec: { ...d.consec, pedido: d.consec.pedido + 1 } }));
    return folio;
  };

  const reset = () => { setDatos(inicial()); setImgs({}); setAuth(false); setVista("tienda"); avisar("Datos restablecidos"); };

  if (cargando || !datos) {
    return (
      <div className="bat" style={{ display: "grid", placeItems: "center", minHeight: "100vh" }}>
        <style>{CSS}</style>
        <div className="eyebrow">Cargando catálogo…</div>
      </div>
    );
  }

  const piezas = carrito.reduce((s, i) => s + i.cant, 0);
  const pendientes = datos.ventas.filter((v) => v.estado === "Pendiente").length;

  return (
    <div className="bat">
      <style>{CSS}</style>

      {vista === "tienda" && (
        <div className="ticker">Instalación gratis · Canje de batería usada · {datos.config.envio}</div>
      )}

      <header className="topbar">
        <div className="topbar-in">
          <div className="logo">
            <div className="logo-mark" aria-hidden="true"><i /><i /><i /></div>
            <span className="logo-txt">{datos.config.negocio}</span>
          </div>
          {vista === "tienda" ? (
            <>
              <div className="hsearch">
                <span aria-hidden="true">⌕</span>
                <input type="search" value={busqueda} onChange={(e) => setBusqueda(e.target.value)}
                  placeholder="Busque su batería: Hyundai Accent 2018, grupo 41, AGM…" aria-label="Buscar" />
              </div>
              <button className="navbtn" onClick={() => setVista("admin")}>Acceso</button>
              <button className="cartbtn" onClick={() => setCestaAbierta(true)}>
                Cesta {piezas > 0 && <span className="pill">{piezas}</span>}
              </button>
            </>
          ) : (
            <>
              <span style={{ marginRight: "auto" }} />
              <button className="navbtn" onClick={() => setVista("tienda")}>Ver la tienda</button>
              {auth && <button className="navbtn" onClick={() => { setAuth(false); setVista("tienda"); }}>Cerrar sesión</button>}
            </>
          )}
        </div>
      </header>

      {vista === "tienda" && (
        <Tienda datos={datos} imgs={imgs} carrito={carrito} setCarrito={setCarrito} avisar={avisar} busqueda={busqueda} />
      )}

      {vista === "admin" && !auth && (
        <Acceso config={datos.config} onEntrar={() => setAuth(true)} onSalir={() => setVista("tienda")} />
      )}

      {vista === "admin" && auth && (
        <div className="wrap" style={{ paddingTop: 24, paddingBottom: 40 }}>
          <div className="eyebrow">Panel interno · {new Date().toLocaleDateString("es-CR", { weekday: "long", day: "numeric", month: "long" })}</div>
          <h2 className="disp" style={{ fontSize: 34, margin: "6px 0 0" }}>Operación del día</h2>

          {errorGuardado && (
            <div className="note" style={{ marginTop: 14, borderColor: "var(--pos)", background: "#FDECEA", color: "#7A1C1C" }}>
              No se pudieron guardar los últimos cambios. Puede ser por el tamaño de las fotos.
              Quite alguna foto pesada o use direcciones de imagen, y repita la acción.
            </div>
          )}

          <div className="tabs">
            {[["resumen", "Resumen"], ["inventario", "Inventario"], ["pos", "Registrar venta"],
              ["ventas", `Ventas y pedidos${pendientes ? ` (${pendientes})` : ""}`], ["ajustes", "Ajustes"]].map(([k, n]) => (
              <button key={k} className={`tab${tab === k ? " on" : ""}`} onClick={() => setTab(k)}>{n}</button>
            ))}
          </div>

          {tab === "resumen" && <Resumen datos={datos} irA={setTab} />}
          {tab === "inventario" && <Inventario datos={datos} setDatos={setDatos} imgs={imgs} setImgs={setImgs} avisar={avisar} />}
          {tab === "pos" && <PuntoVenta datos={datos} setDatos={setDatos} imgs={imgs} avisar={avisar} />}
          {tab === "ventas" && <Ventas datos={datos} setDatos={setDatos} avisar={avisar} />}
          {tab === "ajustes" && <Ajustes datos={datos} setDatos={setDatos} imgs={imgs} avisar={avisar} onReset={reset} />}
        </div>
      )}

      {cestaAbierta && vista === "tienda" && (
        <Cesta datos={datos} imgs={imgs} carrito={carrito} setCarrito={setCarrito}
          onCerrar={() => setCestaAbierta(false)} onPedido={registrarPedido} />
      )}

      {vista === "tienda" && (
        <a className="wa" href={`https://wa.me/${datos.config.whatsapp}`} target="_blank" rel="noopener noreferrer">
          Consultar por WhatsApp
        </a>
      )}

      <footer>
        <div className="wrap foot">
          <div>
            <h5>{datos.config.negocio}</h5>
            <div>{datos.config.direccion}</div>
            <div>{datos.config.horario}</div>
          </div>
          <div>
            <h5>Servicios</h5>
            <div>Instalación sin costo</div>
            <div>Canje de batería usada</div>
            <div>Prueba de alternador y arranque</div>
          </div>
          <div>
            <h5>Pagos</h5>
            <div>Efectivo · SINPE Móvil · Tarjeta</div>
            <div style={{ marginTop: 10 }}>
              {vista === "tienda" && <a onClick={() => setVista("admin")}>Acceso para personal</a>}
            </div>
          </div>
        </div>
      </footer>

      {toast && <div className="toast">{toast}</div>}
    </div>
  );
}


/* ---------------- montaje ---------------- */
const raiz = ReactDOM.createRoot(document.getElementById("root"));
raiz.render(<App />);

</script>
</body>
</html>
