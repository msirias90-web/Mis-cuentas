/* window.storage solo existe dentro de Claude. Fuera de ahi guardamos
   en el navegador para que la aplicacion funcione igual. */
if (!window.storage) {
  window.storage = {
    get: async (k) => {
      const v = localStorage.getItem(k);
      if (v === null) throw new Error("no existe");
      return { key: k, value: v };
    },
    set: async (k, v) => { localStorage.setItem(k, v); return { key: k, value: v }; },
    delete: async (k) => { localStorage.removeItem(k); return { key: k, deleted: true }; },
    list: async (p = "") => ({ keys: Object.keys(localStorage).filter((k) => k.startsWith(p)) }),
  };
}

/* ====================== utilidades ====================== */

const hash = (t) => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) >>> 0; return String(h); };
const id = () => Math.random().toString(36).slice(2, 10);
/* Separador de miles con punto, como se escribe en Costa Rica. */
const miles = (n) => {
  const x = Math.round(Number(n) || 0);
  return (x < 0 ? "-" : "") + Math.abs(x).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
};
const hoy = () => new Date().toISOString().slice(0, 10);
const fecha = (iso) => new Date(iso).toLocaleDateString("es-CR", { day: "2-digit", month: "short", year: "2-digit" });
const fechaHora = (iso) => new Date(iso).toLocaleDateString("es-CR", { day: "2-digit", month: "short" }) + ", " +
  new Date(iso).toLocaleTimeString("es-CR", { hour: "2-digit", minute: "2-digit" });

const codigo = () => {
  const letras = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 6; i++) c += letras[Math.floor(Math.random() * letras.length)];
  return c.slice(0, 3) + "-" + c.slice(3);
};

const csv = (nombre, filas) => {
  const t = filas.map((f) => f.map((c) => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob(["\ufeff" + t], { type: "text/csv;charset=utf-8;" }));
  const a = document.createElement("a");
  a.href = url; a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
};

/** Reduce la foto a 700 px y la comprime, para que quepa en el almacenamiento. */
const comprimirImagen = (file) =>
  new Promise((ok, mal) => {
    const fr = new FileReader();
    fr.onerror = () => mal(new Error("lectura"));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => mal(new Error("imagen"));
      im.onload = () => {
        const max = 700;
        const esc = Math.min(1, max / Math.max(im.width, im.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * esc);
        cv.height = Math.round(im.height * esc);
        const cx = cv.getContext("2d");
        cx.fillStyle = "var(--arena-claro)";
        cx.fillRect(0, 0, cv.width, cv.height);
        cx.drawImage(im, 0, 0, cv.width, cv.height);
        ok(cv.toDataURL("image/jpeg", 0.74));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });

function Ilustracion({ tipo }) {
  return (
    <svg viewBox="0 0 160 112" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      {FIGURAS[tipo] || FIGURAS.mercancia}
    </svg>
  );
}

function Imagen({ premio, imgs }) {
  const src = (imgs && imgs[premio.id]) || (premio.img || "").trim();
  const [falla, setFalla] = useState(false);
  useEffect(() => setFalla(false), [src]);
  if (src && !falla) {
    return <img src={src} alt={premio.nombre} loading="lazy" onError={() => setFalla(true)} />;
  }
  return <Ilustracion tipo={premio.icono} />;
}

/* ---------- Código de barras Code 39 ----------
   Tabla verificada contra la implementación de referencia de python-barcode.
   n = elemento angosto, w = elemento ancho; las posiciones pares son barras. */
const C39 = {
  "0": "nnnwwnwnn", "1": "wnnwnnnnw", "2": "nnwwnnnnw", "3": "wnwwnnnnn", "4": "nnnwwnnnw",
  "5": "wnnwwnnnn", "6": "nnwwwnnnn", "7": "nnnwnnwnw", "8": "wnnwnnwnn", "9": "nnwwnnwnn",
  "A": "wnnnnwnnw", "B": "nnwnnwnnw", "C": "wnwnnwnnn", "D": "nnnnwwnnw", "E": "wnnnwwnnn",
  "F": "nnwnwwnnn", "G": "nnnnnwwnw", "H": "wnnnnwwnn", "I": "nnwnnwwnn", "J": "nnnnwwwnn",
  "K": "wnnnnnnww", "L": "nnwnnnnww", "M": "wnwnnnnwn", "N": "nnnnwnnww", "O": "wnnnwnnwn",
  "P": "nnwnwnnwn", "Q": "nnnnnnwww", "R": "wnnnnnwwn", "S": "nnwnnnwwn", "T": "nnnnwnwwn",
  "U": "wwnnnnnnw", "V": "nwwnnnnnw", "W": "wwwnnnnnn", "X": "nwnnwnnnw", "Y": "wwnnwnnnn",
  "Z": "nwwnwnnnn", "-": "nwnnnnwnw", "*": "nwnnwnwnn",
};

function Barras({ valor, alto = 58 }) {
  const limpio = String(valor || "").toUpperCase().replace(/[^0-9A-Z-]/g, "");
  const cadena = "*" + limpio + "*";
  const ANGOSTO = 2, ANCHO = 5, SEPARACION = 2;
  const barras = [];
  let x = 0, k = 0;
  for (const ch of cadena) {
    const patron = C39[ch];
    if (!patron) continue;
    for (let i = 0; i < patron.length; i++) {
      const w = patron[i] === "w" ? ANCHO : ANGOSTO;
      if (i % 2 === 0) barras.push(<rect key={k++} x={x} y="0" width={w} height={alto} />);
      x += w;
    }
    x += SEPARACION;
  }
  if (!barras.length) return null;
  return (
    <svg className="barcode" viewBox={`0 0 ${x} ${alto}`} preserveAspectRatio="none"
      role="img" aria-label={`Código ${limpio}`}>
      <g fill="#06302B">{barras}</g>
    </svg>
  );
}

function Campo({ label, children }) {
  return <div className="campo"><label>{label}</label>{children}</div>;
}

function Modal({ titulo, cerrar, children, pie, ancho }) {
  useEffect(() => {
    const esc = (e) => e.key === "Escape" && cerrar();
    window.addEventListener("keydown", esc);
    return () => window.removeEventListener("keydown", esc);
  }, [cerrar]);
  return (
    <div className="velo" onMouseDown={(e) => e.target === e.currentTarget && cerrar()}>
      <div className="modal" style={ancho ? { width: `min(${ancho}px,100%)` } : undefined}>
        <div className="modal-cab">
          <h2>{titulo}</h2>
          <button className="equis" onClick={cerrar} aria-label="Cerrar">×</button>
        </div>
        <div className="modal-cue">{children}</div>
        {pie && <div className="modal-pie">{pie}</div>}
      </div>
    </div>
  );
}

/* ====================== lógica de saldos ====================== */

/* Referencia de catálogo: tres letras de la categoría más el costo, como un número de parte. */
const refPremio = (p) =>
  `${(p.cat || "GEN").replace(/[^A-Za-zÁÉÍÓÚÑ]/g, "").slice(0, 3).toUpperCase()}-${String(p.costo).padStart(4, "0")}`;

const saldoDe = (datos, personaId) =>
  datos.movimientos.filter((m) => m.persona === personaId).reduce((s, m) => s + m.puntos, 0);

const ganadosDe = (datos, personaId) =>
  datos.movimientos.filter((m) => m.persona === personaId && m.puntos > 0).reduce((s, m) => s + m.puntos, 0);

/* ====================== entrada ====================== */

function Entrada({ datos, entrar }) {
  const [usuario, setUsuario] = useState("");
  const [clave, setClave] = useState("");
  const [mal, setMal] = useState("");
  const ref = useRef(null);
  useEffect(() => ref.current?.focus(), []);

  const intentar = () => {
    const u = datos.personas.find(
      (p) => p.usuario.toLowerCase() === usuario.trim().toLowerCase() && p.activo
    );
    const esperado = u ? (datos.config.claves[u.id] || hash(u.clave)) : null;
    if (!u || hash(clave) !== esperado) {
      setMal("Usuario o contraseña incorrectos.");
      setClave("");
      return;
    }
    entrar(u);
  };

  return (
    <div className="entrada">
      <div className="caja">
        <Logo />
        <h1>{datos.config.programa}</h1>
        <div className="form">
          <Campo label="Usuario">
            <input ref={ref} value={usuario} autoCapitalize="none"
              onChange={(e) => { setUsuario(e.target.value); setMal(""); }}
              onKeyDown={(e) => e.key === "Enter" && intentar()} />
          </Campo>
          <Campo label="Contraseña">
            <input type="password" value={clave}
              onChange={(e) => { setClave(e.target.value); setMal(""); }}
              onKeyDown={(e) => e.key === "Enter" && intentar()} />
          </Campo>
          {mal && <p className="mal">{mal}</p>}
          <button className="b oro" style={{ width: "100%" }} onClick={intentar}>Entrar</button>
          <div className="claves">
            Para la demostración: <code>MSirias</code> o <code>MBarrantes</code> con <code>admin123</code>.
            Los demás entran con su usuario y <code>clave123</code>.
          </div>
        </div>
      </div>
    </div>
  );
}

/* ====================== vista del colaborador ====================== */

function MiSaldo({ datos, imgs, yo, canjear, avisar }) {
  const [confirmar, setConfirmar] = useState(null);
  const [vale, setVale] = useState(null);

  const saldo = saldoDe(datos, yo.id);
  const ganados = ganadosDe(datos, yo.id);
  const mis = datos.movimientos.filter((m) => m.persona === yo.id);
  const premios = datos.premios.filter((p) => p.activo).sort((a, b) => a.costo - b.costo);
  const canjeados = ganados - saldo;
  const alcanzables = premios.filter((p) => p.stock > 0 && p.costo <= saldo).length;
  const siguiente = premios.find((p) => p.costo > saldo) || null;

  const hacerCanje = () => {
    const r = canjear(yo.id, confirmar.id);
    setConfirmar(null);
    if (r.error) return avisar(r.error);
    setVale(r.canje);
  };

  return (
    <>
      <section className="tablero">
        <div className="tablero-main">
          <span className="rot">Puntos disponibles</span>
          <div className="saldo-num">{miles(saldo)}</div>
          {siguiente ? (
            <div className="rail">
              <div className="rail-barra">
                <span style={{ width: `${Math.min(100, Math.round((saldo / siguiente.costo) * 100))}%` }} />
              </div>
              <span className="rail-txt">
                Le faltan <b>{miles(siguiente.costo - saldo)}</b> puntos para {siguiente.nombre}
              </span>
            </div>
          ) : (
            <div className="rail">
              <span className="rail-txt">
                {alcanzables > 0
                  ? "Alcanza todos los premios del catálogo."
                  : "Cuando le asignen puntos los verá aquí."}
              </span>
            </div>
          )}
        </div>
        <dl className="tablero-datos">
          <div><dt>Ganados en total</dt><dd>{miles(ganados)}</dd></div>
          <div><dt>Ya canjeados</dt><dd>{miles(canjeados)}</dd></div>
          <div><dt>Premios a su alcance</dt><dd>{alcanzables}</dd></div>
        </dl>
      </section>

      <div className="bloque">
        <h2>Premios</h2>
        <p className="pie">Los que están resaltados ya los alcanza con su saldo actual.</p>
        <div className="tiquetes">
          {premios.map((p) => {
            const agotado = p.stock <= 0;
            const alcanza = !agotado && saldo >= p.costo;
            return (
              <article key={p.id} className={`tk ${agotado ? "agotado" : alcanza ? "alcanza" : ""}`}>
                <header className="tk-cab">
                  <span className="tk-ref mono">{refPremio(p)}</span>
                  <span className="tk-cat">{p.cat}</span>
                </header>
                <div className="tk-img"><Imagen premio={p} imgs={imgs} /></div>
                <div className="tk-texto">
                  <h3>{p.nombre}</h3>
                  <p>{p.desc}</p>
                </div>
                <div className="tk-campos">
                  <div><small>Puntos</small><b>{miles(p.costo)}</b></div>

                    </td>
                    <td>{m.cat ? <span className="etq gris">{m.cat}</span> : ""}</td>
                    <td className={`der ${m.puntos > 0 ? "mas" : "menos"}`}>

            <button className="b hueco" onClick={() => setConfirmar(null)}>Cancelar</button>
            <button className="b oro" onClick={hacerCanje}>Canjear {miles(confirmar.costo)} puntos</button>
          </>}>
          <p style={{ marginTop: 0 }}>
            Va a canjear <b>{confirmar.nombre}</b> por {miles(confirmar.costo)} puntos.
            Le quedarían {miles(saldo - confirmar.costo)}.
          </p>

          </p>

      {vale && (

          pie={<button className="b oro" onClick={() => setVale(null)}>Listo</button>}>

}

/* ====================== otorgar puntos ====================== */

function Otorgar({ datos, otorgar, avisar }) {
  const [sel, setSel] = useState([]);
  const [cat, setCat] = useState(CATEGORIAS[0].nombre);
  const [puntos, setPuntos] = useState(CATEGORIAS[0].sugerido);
  const [proyecto, setProyecto] = useState("");
  const [nota, setNota] = useState("");
  const [busca, setBusca] = useState("");

  const gente = datos.personas.filter(
    (p) => p.rol === "colaborador" && p.activo &&
      (!busca.trim() || `${p.nombre} ${p.depto} ${p.puesto}`.toLowerCase().includes(busca.toLowerCase()))
  );

  const alternar = (pid) =>
    setSel((s) => (s.includes(pid) ? s.filter((x) => x !== pid) : [...s, pid]));

  const elegirCat = (c) => { setCat(c.nombre); setPuntos(c.sugerido); };

  const enviar = () => {
    const n = Number(puntos);
    if (sel.length === 0) return avisar("Escoja al menos una persona");
    if (!n || n <= 0) return avisar("Los puntos deben ser mayores que cero");
    if (!nota.trim()) return avisar("Escriba el motivo del reconocimiento");
    otorgar({ personas: sel, puntos: n, cat, proyecto: proyecto.trim(), nota: nota.trim() });
    avisar(`${miles(n)} puntos para ${sel.length} ${sel.length === 1 ? "persona" : "personas"}`);
    setSel([]); setProyecto(""); setNota("");
  };

  return (
    <div className="bloque">
      <h2>Otorgar puntos</h2>
      <p className="pie">Cada asignación queda registrada con su motivo, para que después se pueda explicar.</p>

      <Campo label="¿A quién?">
        <input value={busca} onChange={(e) => setBusca(e.target.value)}
          placeholder="Filtrar por nombre, puesto o departamento" />
      </Campo>
      <div className="gente">
        {gente.map((p) => (
          <label key={p.id}>
            <input type="checkbox" checked={sel.includes(p.id)} onChange={() => alternar(p.id)} />
            {p.nombre}
            <span>{miles(saldoDe(datos, p.id))}</span>
          </label>
        ))}
        {gente.length === 0 && <span style={{ color: "var(--soft)", fontSize: 14 }}>Nadie coincide con ese filtro.</span>}
      </div>
      <p style={{ fontSize: 13.5, color: "var(--soft)", margin: "8px 0 16px" }}>
        {sel.length === 0 ? "Nadie seleccionado todavía." : `${sel.length} seleccionada${sel.length === 1 ? "" : "s"}.`}
      </p>

      <Campo label="¿Por qué? Escoja la categoría">
        <select value={cat} onChange={(e) => elegirCat(CATEGORIAS.find((c) => c.nombre === e.target.value))}>
          {CATEGORIAS.map((c) => <option key={c.nombre}>{c.nombre}</option>)}
        </select>
      </Campo>

      <div className="dos">
        <Campo label="Puntos por persona">
          <input type="number" value={puntos} min="1" onChange={(e) => setPuntos(e.target.value)} />
        </Campo>
        <Campo label="Proyecto o iniciativa (opcional)">
          <input value={proyecto} onChange={(e) => setProyecto(e.target.value)} placeholder="Migración de inventario" />
        </Campo>
      </div>
      <div className="sugerido">
        {[50, 100, 150, 250, 500].map((n) => (
          <button key={n} onClick={() => setPuntos(n)}>{n}</button>
        ))}
      </div>

      <Campo label="Motivo, en una frase">
        <textarea rows={3} value={nota} onChange={(e) => setNota(e.target.value)}
          placeholder="Propuso el cambio que bajó el tiempo de despacho de 40 a 22 minutos." />
      </Campo>

      <button className="b oro" onClick={enviar}>
        Otorgar {sel.length > 0 && Number(puntos) > 0
          ? `${miles(Number(puntos) * sel.length)} puntos en total`
          : "puntos"}
      </button>
    </div>
  );
}

/* ====================== resumen ====================== */

function Resumen({ datos, ir }) {
  const mes = hoy().slice(0, 7);
  const otorgados = datos.movimientos.filter((m) => m.puntos > 0);
  const delMes = otorgados.filter((m) => m.fecha.slice(0, 7) === mes);
  const pendientes = datos.canjes.filter((c) => c.estado === "Pendiente");
  const circulacion = datos.personas
    .filter((p) => p.rol === "colaborador")
    .reduce((s, p) => s + saldoDe(datos, p.id), 0);
  const sinStock = datos.premios.filter((p) => p.activo && p.stock <= 0);

  const porCategoria = CATEGORIAS.map((c) => ({
    nombre: c.nombre,
    total: otorgados.filter((m) => m.cat === c.nombre).reduce((s, m) => s + m.puntos, 0),
  })).filter((c) => c.total > 0).sort((a, b) => b.total - a.total);
  const mayor = porCategoria[0]?.total || 1;

  return (
    <>
      <div className="cifras">
        <div className="cifra"><b className="num">{miles(delMes.reduce((s, m) => s + m.puntos, 0))}</b><span>puntos otorgados este mes</span></div>
        <div className="cifra ojo"><b className="num">{pendientes.length}</b><span>canjes esperando entrega</span></div>
        <div className="cifra"><b className="num">{miles(circulacion)}</b><span>puntos sin canjear en manos del equipo</span></div>
        <div className="cifra"><b className="num">{datos.personas.filter((p) => p.rol === "colaborador" && p.activo).length}</b><span>personas en el programa</span></div>
      </div>

      {pendientes.length > 0 && (
        <div className="bloque">
          <h2>Canjes por entregar</h2>
          <p className="pie">Los puntos ya se descontaron. Falta hacer llegar el premio.</p>
          {pendientes.slice(0, 6).map((c) => {
            const p = datos.personas.find((x) => x.id === c.persona);
            return (
              <div key={c.codigo} style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "10px 0", borderBottom: "1px solid #DFD4BE", fontSize: 14.5 }}>
                <span><b style={{ letterSpacing: ".04em" }}>{c.codigo}</b> · {p?.nombre}</span>
                <span style={{ color: "var(--soft)" }}>{c.premioNombre}</span>
              </div>
            );
          })}
          <button className="b hueco chico" style={{ marginTop: 14 }} onClick={() => ir("canjes")}>Ver todos los canjes</button>
        </div>
      )}

      <div className="bloque">
        <h2>Por qué se están dando los puntos</h2>
        <p className="pie">Si una sola categoría se lleva todo, el programa está premiando una sola cosa.</p>
        {porCategoria.length === 0 ? (
          <div className="vacio"><b>Sin datos todavía</b>Otorgue los primeros puntos para ver el reparto.</div>
        ) : porCategoria.map((c) => (
          <div key={c.nombre} className="barras-cat">
            <div className="fila">
              <span>{c.nombre}</span>
              <span className="mono" style={{ fontWeight: 600 }}>{miles(c.total)}</span>
            </div>
            <div className="pista">
              <span style={{ width: `${(c.total / mayor) * 100}%` }} />
            </div>
          </div>
        ))}
      </div>

      {sinStock.length > 0 && (
        <div className="nota">
          <b>Premios agotados</b>
          {sinStock.map((p) => p.nombre).join(", ")}. Siguen visibles en el catálogo pero nadie puede canjearlos.
        </div>
      )}
    </>
  );
}

/* ====================== premios ====================== */

const PREMIO_VACIO = { nombre: "", desc: "", costo: 100, stock: 1, cat: "Mercancía", icono: "mercancia", img: "", activo: true };

function Premios({ datos, setDatos, imgs, setImgs, avisar }) {
  const [edita, setEdita] = useState(null);
  const [foto, setFoto] = useState(null);
  const [borra, setBorra] = useState(null);
  const archivo = useRef(null);

  const abrir = (p) => {
    setEdita(p ? { ...p } : { ...PREMIO_VACIO });
    setFoto(p ? (imgs[p.id] || null) : null);
  };

  const subir = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) return avisar("La foto pesa más de 8 MB");
    try { setFoto(await comprimirImagen(f)); }
    catch { avisar("No se pudo leer la foto"); }
    e.target.value = "";
  };

  const guardar = () => {
    const p = { ...edita, costo: Number(edita.costo) || 0, stock: Number(edita.stock) || 0 };
    if (!p.nombre.trim()) return avisar("Falta el nombre del premio");
    if (p.costo <= 0) return avisar("El costo en puntos debe ser mayor que cero");
    const pid = p.id || id();
    setDatos((d) => ({
      ...d,
      premios: p.id ? d.premios.map((x) => (x.id === pid ? p : x)) : [...d.premios, { ...p, id: pid }],
    }));
    setImgs((m) => { const n = { ...m }; if (foto) n[pid] = foto; else delete n[pid]; return n; });
    avisar(p.id ? "Premio actualizado" : "Premio agregado al catálogo");
    setEdita(null); setFoto(null);
  };

  const ajustar = (pid, n) =>
    setDatos((d) => ({ ...d, premios: d.premios.map((p) => p.id === pid ? { ...p, stock: Math.max(0, p.stock + n) } : p) }));

  return (
    <div className="bloque">
      <h2>Catálogo de premios</h2>
      <p className="pie">Lo que el equipo puede pedir con sus puntos.</p>

      <div style={{ marginBottom: 16 }}>
        <button className="b oro" onClick={() => abrir(null)}>Agregar premio</button>
      </div>

      <div className="scroll">
        <table>
          <thead><tr><th></th><th>Premio</th><th>Categoría</th><th className="der">Puntos</th><th>Existencias</th><th>Estado</th><th></th></tr></thead>
          <tbody>
            {datos.premios.map((p) => (
              <tr key={p.id}>
                <td><div className="mini"><Imagen premio={p} imgs={imgs} /></div></td>
                <td>
                  <b>{p.nombre}</b>
                  <div style={{ fontSize: 12.5, color: "var(--soft)", maxWidth: 340 }}>{p.desc}</div>
                </td>
                <td style={{ color: "var(--soft)" }}>{p.cat}</td>
                <td className="der"><b>{miles(p.costo)}</b></td>
                <td>
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 7 }}>
                    <button className="b hueco chico" onClick={() => ajustar(p.id, -1)} aria-label="Quitar uno">−</button>
                    <b className="num" style={{ minWidth: 22, textAlign: "center", display: "inline-block" }}>{p.stock}</b>
                    <button className="b hueco chico" onClick={() => ajustar(p.id, 1)} aria-label="Agregar uno">+</button>
                    {p.stock === 0 && <span className="etq no">Agotado</span>}
                  </span>
                </td>
                <td>
                  <button className={`etq ${p.activo ? "list" : "gris"}`} style={{ background: "none", cursor: "pointer" }}
                    onClick={() => setDatos((d) => ({ ...d, premios: d.premios.map((x) => x.id === p.id ? { ...x, activo: !x.activo } : x) }))}>
                    {p.activo ? "En catálogo" : "Oculto"}
                  </button>
                </td>
                <td style={{ whiteSpace: "nowrap" }}>
                  <button className="b hueco chico" onClick={() => abrir(p)}>Editar</button>{" "}
                  <button className="b peligro chico" onClick={() => setBorra(p)}>Eliminar</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {edita && (
        <Modal titulo={edita.id ? "Editar premio" : "Nuevo premio"} cerrar={() => { setEdita(null); setFoto(null); }} ancho={680}
          pie={<>
            <button className="b hueco" onClick={() => { setEdita(null); setFoto(null); }}>Cancelar</button>
            <button className="b oro" onClick={guardar}>Guardar</button>
          </>}>
          <Campo label="Nombre">
            <input value={edita.nombre} onChange={(e) => setEdita({ ...edita, nombre: e.target.value })} />
          </Campo>
          <Campo label="Descripción, en una frase">
            <textarea rows={2} value={edita.desc} onChange={(e) => setEdita({ ...edita, desc: e.target.value })} />
          </Campo>
          <div className="tres">
            <Campo label="Costo en puntos">
              <input type="number" value={edita.costo} onChange={(e) => setEdita({ ...edita, costo: e.target.value })} />
            </Campo>
            <Campo label="Existencias">
              <input type="number" value={edita.stock} onChange={(e) => setEdita({ ...edita, stock: e.target.value })} />
            </Campo>
            <Campo label="Categoría">
              <select value={edita.cat} onChange={(e) => setEdita({ ...edita, cat: e.target.value })}>
                {CATS_PREMIO.map((c) => <option key={c}>{c}</option>)}
              </select>
            </Campo>
          </div>

          <div style={{ display: "flex", gap: 16, flexWrap: "wrap", marginBottom: 14 }}>
            <div className="previa">
              {foto ? <img src={foto} alt="Vista previa" /> : <Ilustracion tipo={edita.icono} />}
            </div>
            <div style={{ flex: "1 1 240px", minWidth: 0 }}>
              <label style={{ fontSize: 13.5, fontWeight: 600, display: "block", marginBottom: 5 }}>Imagen</label>
              <p style={{ fontSize: 13.5, color: "var(--soft)", margin: "0 0 10px" }}>
                Suba una foto propia o deje la ilustración. Si sube foto, esa manda sobre la ilustración.
              </p>
              <input ref={archivo} type="file" accept="image/*" onChange={subir} style={{ display: "none" }} />
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
                <button className="b hueco chico" onClick={() => archivo.current?.click()}>Subir foto</button>
                {foto && <button className="b peligro chico" onClick={() => setFoto(null)}>Quitar foto</button>}
              </div>
              <Campo label="O dirección de imagen (URL)">
                <input value={edita.img} onChange={(e) => setEdita({ ...edita, img: e.target.value })}
                  placeholder="https://…/premio.jpg" />
              </Campo>
            </div>
          </div>

          <label style={{ fontSize: 13.5, fontWeight: 600, display: "block", marginBottom: 7 }}>Ilustración</label>
          <div className="iconos" style={{ marginBottom: 16 }}>
            {ICONOS.map(([k, n]) => (
              <button key={k} aria-pressed={edita.icono === k} title={n}
                onClick={() => setEdita({ ...edita, icono: k })}>
                <Ilustracion tipo={k} />
                <small>{n}</small>
              </button>
            ))}
          </div>

          <label style={{ display: "flex", gap: 8, alignItems: "center", fontSize: 14.5 }}>
            <input type="checkbox" checked={edita.activo} onChange={(e) => setEdita({ ...edita, activo: e.target.checked })} />
            Mostrar en el catálogo
          </label>
        </Modal>
      )}

      {borra && (
        <Modal titulo="Eliminar premio" cerrar={() => setBorra(null)}
          pie={<>
            <button className="b hueco" onClick={() => setBorra(null)}>Cancelar</button>
            <button className="b peligro" onClick={() => {
              setDatos((d) => ({ ...d, premios: d.premios.filter((p) => p.id !== borra.id) }));
              setImgs((m) => { const n = { ...m }; delete n[borra.id]; return n; });
              avisar("Premio eliminado"); setBorra(null);
            }}>Sí, eliminar</button>
          </>}>
          <p style={{ margin: 0 }}>
            Va a sacar <b>{borra.nombre}</b> del catálogo de forma permanente. Los canjes ya hechos
            conservan el nombre. Si solo quiere dejar de ofrecerlo, ocúltelo en lugar de eliminarlo.
          </p>
        </Modal>
      )}
    </div>
  );
}

/* ====================== canjes ====================== */

function Canjes({ datos, entregar, rechazar, avisar }) {
  const [filtro, setFiltro] = useState("Pendiente");
  const [rechazando, setRechazando] = useState(null);
  const [motivo, setMotivo] = useState("");

  const lista = datos.canjes.filter((c) => filtro === "Todos" || c.estado === filtro);
  const etq = (e) => (e === "Entregado" ? "list" : e === "Rechazado" ? "no" : "esp");

  const exportar = () => csv("canjes.csv", [
    ["Código", "Fecha", "Persona", "Premio", "Puntos", "Estado"],
    ...datos.canjes.map((c) => [c.codigo, c.fecha,
      datos.personas.find((p) => p.id === c.persona)?.nombre, c.premioNombre, c.costo, c.estado]),
  ]);

  return (
    <div className="bloque">
      <h2>Canjes</h2>
      <p className="pie">Al entregar el premio, marque el canje. Si no se puede entregar, recháselo y los puntos vuelven.</p>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 16, alignItems: "center" }}>
        {["Pendiente", "Entregado", "Rechazado", "Todos"].map((f) => (
          <button key={f} className={`b ${filtro === f ? "oro" : "hueco"} chico`} onClick={() => setFiltro(f)}>{f}</button>
        ))}
        <button className="b hueco" style={{ marginLeft: "auto" }} onClick={exportar}>Exportar a Excel</button>
      </div>

      {lista.length === 0 ? (
        <div className="vacio">
          <b>Nada en {filtro.toLowerCase()}</b>
          {filtro === "Pendiente" ? "No hay premios esperando entrega." : "Cambie el filtro para ver otros canjes."}
        </div>
      ) : (
        <div className="scroll">
          <table>
            <thead><tr><th>Código</th><th>Persona</th><th>Premio</th><th>Fecha</th><th className="der">Puntos</th><th>Estado</th><th></th></tr></thead>
            <tbody>
              {lista.map((c) => {
                const p = datos.personas.find((x) => x.id === c.persona);
                return (
                  <tr key={c.codigo}>
                    <td style={{ fontWeight: 700, letterSpacing: ".04em" }}>{c.codigo}</td>
                    <td>{p?.nombre}<div style={{ fontSize: 12.5, color: "var(--soft)" }}>{p?.depto}</div></td>
                    <td>{c.premioNombre}</td>
                    <td style={{ whiteSpace: "nowrap", color: "var(--soft)" }}>{fechaHora(c.fecha)}</td>
                    <td className="der">{miles(c.costo)}</td>
                    <td><span className={`etq ${etq(c.estado)}`}>{c.estado}</span></td>
                    <td style={{ whiteSpace: "nowrap" }}>
                      {c.estado === "Pendiente" && (
                        <>
                          <button className="b chico" onClick={() => { entregar(c.codigo); avisar(`${c.codigo} marcado como entregado`); }}>
                            Entregado
                          </button>{" "}
                          <button className="b peligro chico" onClick={() => { setRechazando(c); setMotivo(""); }}>
                            Rechazar
                          </button>
                        </>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}

      {rechazando && (
        <Modal titulo="Rechazar el canje" cerrar={() => setRechazando(null)}
          pie={<>
            <button className="b hueco" onClick={() => setRechazando(null)}>Cancelar</button>
            <button className="b peligro" onClick={() => {
              rechazar(rechazando.codigo, motivo.trim());
              avisar(`Puntos devueltos a ${datos.personas.find((p) => p.id === rechazando.persona)?.nombre}`);
              setRechazando(null);
            }}>Rechazar y devolver puntos</button>
          </>}>
          <p style={{ marginTop: 0 }}>
            Se devuelven {miles(rechazando.costo)} puntos y el premio regresa al inventario.
            La persona verá el motivo en su historial.
          </p>
          <Campo label="Motivo">
            <textarea rows={3} value={motivo} onChange={(e) => setMotivo(e.target.value)}
              placeholder="El proveedor no tiene existencias hasta el próximo mes." />
          </Campo>
        </Modal>
      )}
    </div>
  );
}

/* ====================== ajustes ====================== */

function Ajustes({ datos, setDatos, yo, avisar, reiniciar, limpiarHistorial }) {
  const [c, setC] = useState(datos.config);
  const [nueva, setNueva] = useState("");
  const [confirma, setConfirma] = useState(false);
  const [limpia, setLimpia] = useState(false);

  const guardar = () => {
    const cfg = { ...c };
    if (nueva.trim()) {
      if (nueva.trim().length < 6) return avisar("La contraseña debe tener al menos 6 caracteres");
      cfg.claves = { ...cfg.claves, [yo.id]: hash(nueva.trim()) };
    }
    setDatos((d) => ({ ...d, config: cfg }));
    setNueva(""); avisar("Ajustes guardados");
  };

  return (
    <>
      <div className="bloque">
        <h2>El programa</h2>
        <p className="pie">Lo que ve el equipo al entrar.</p>
        <div className="dos">
          <Campo label="Nombre del programa">
            <input value={c.programa} onChange={(e) => setC({ ...c, programa: e.target.value })} />
          </Campo>
          <Campo label="Empresa">
            <input value={c.empresa} onChange={(e) => setC({ ...c, empresa: e.target.value })} />
          </Campo>
        </div>
      </div>

      <div className="bloque">
        <h2>Mi contraseña</h2>
        <Campo label="Nueva contraseña (mínimo 6 caracteres)">
          <input type="password" value={nueva} onChange={(e) => setNueva(e.target.value)}
            placeholder="Déjela vacía para no cambiarla" />
        </Campo>
        <div className="nota" style={{ marginBottom: 0 }}>
          <b>Esta versión no protege información real</b>
          Las contraseñas se validan dentro del navegador. Sirve para mostrar el flujo, pero cualquiera
          con la consola abierta puede ver los datos. Para usarlo de verdad hacen falta servidor,
          contraseñas cifradas y sesiones.
        </div>
      </div>

      <div className="bloque">
        <h2>Empezar en limpio</h2>
        <p className="pie">
          Los movimientos y canjes que trae la aplicación son inventados, solo para mostrar cómo se ve
          con datos. Bórrelos antes de usarla de verdad: las personas y los premios se mantienen.
        </p>
        <button className="b hueco" onClick={() => setLimpia(true)}>Borrar movimientos y canjes</button>
      </div>

      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        <button className="b oro" onClick={guardar}>Guardar ajustes</button>
        <button className="b peligro" onClick={() => setConfirma(true)}>Volver a los datos de ejemplo</button>
      </div>

      {limpia && (
        <Modal titulo="Borrar movimientos y canjes" cerrar={() => setLimpia(false)}
          pie={<>
            <button className="b hueco" onClick={() => setLimpia(false)}>Cancelar</button>
            <button className="b peligro" onClick={() => { limpiarHistorial(); setLimpia(false); }}>
              Sí, dejar los saldos en cero
            </button>
          </>}>
          <p style={{ margin: 0 }}>
            Todos los saldos quedan en cero y se borra el historial completo. Las personas, los premios
            y las existencias no se tocan. Esto no se puede deshacer.
          </p>
        </Modal>
      )}

      {confirma && (
        <Modal titulo="Volver a los datos de ejemplo" cerrar={() => setConfirma(false)}
          pie={<>
            <button className="b hueco" onClick={() => setConfirma(false)}>Cancelar</button>
            <button className="b peligro" onClick={() => { reiniciar(); setConfirma(false); }}>Sí, reiniciar</button>
          </>}>
          <p style={{ margin: 0 }}>
            Se borran las personas, los premios, los movimientos y los canjes, y vuelve el contenido
            de ejemplo. Esto no se puede deshacer.
          </p>
        </Modal>
      )}
    </>
  );
}

/* ====================== app ====================== */

function App() {
  const [datos, setDatos] = useState(null);
  const [imgs, setImgs] = useState({});
  const [cargando, setCargando] = useState(true);
  const [falloGuardado, setFalloGuardado] = useState(false);
  const [yo, setYo] = useState(null);
  const [seccion, setSeccion] = useState("resumen");
  const [aviso, setAviso] = useState("");

  const inicial = () => ({
    personas: PERSONAS.map((p) => ({ ...p })),
    premios: PREMIOS.map((p) => ({ ...p })),
    movimientos: movimientosIniciales(),
    canjes: [],
    config: { ...CONFIG },
  });

  const avisar = (m) => { setAviso(m); setTimeout(() => setAviso(""), 2600); };

  useEffect(() => {
    (async () => {
      let d = null, m = {};
      try { const r = await window.storage.get(LLAVE); d = r ? JSON.parse(r.value) : null; } catch { d = null; }
      try { const r = await window.storage.get(LLAVE_IMG); m = r ? JSON.parse(r.value) : {}; } catch { m = {}; }
      setDatos(d || inicial()); setImgs(m); setCargando(false);
    })();
  }, []);

  useEffect(() => {
    if (!datos || cargando) return;
    const t = setTimeout(async () => {
      try { await window.storage.set(LLAVE, JSON.stringify(datos)); setFalloGuardado(false); }
      catch { setFalloGuardado(true); }
    }, 450);
    return () => clearTimeout(t);
  }, [datos, cargando]);

  useEffect(() => {
    if (cargando) return;
    const t = setTimeout(async () => {
      try { await window.storage.set(LLAVE_IMG, JSON.stringify(imgs)); }
      catch { setFalloGuardado(true); }
    }, 650);
    return () => clearTimeout(t);
  }, [imgs, cargando]);

  /* --- operaciones --- */

  const otorgar = ({ personas, puntos, cat, proyecto, nota }) => {
    const ahora = new Date().toISOString();
    const nuevos = personas.map((persona) => ({
      id: id(), persona, tipo: "otorgado", puntos, cat, proyecto, nota, fecha: ahora, por: yo.id,
    }));
    setDatos((d) => ({ ...d, movimientos: [...nuevos, ...d.movimientos] }));
  };

  const canjear = (personaId, premioId) => {
    const premio = datos.premios.find((p) => p.id === premioId);
    if (!premio) return { error: "Ese premio ya no está disponible" };
    if (premio.stock <= 0) return { error: "Ese premio se agotó" };
    if (saldoDe(datos, personaId) < premio.costo) return { error: "No le alcanzan los puntos" };

    const canje = {
      codigo: codigo(), persona: personaId, premio: premio.id, premioNombre: premio.nombre,
      costo: premio.costo, estado: "Pendiente", fecha: new Date().toISOString(),
    };
    setDatos((d) => ({
      ...d,
      canjes: [canje, ...d.canjes],
      premios: d.premios.map((p) => (p.id === premio.id ? { ...p, stock: Math.max(0, p.stock - 1) } : p)),
      movimientos: [{
        id: id(), persona: personaId, tipo: "canje", puntos: -premio.costo,
        cat: "", proyecto: "", nota: `Canje de ${premio.nombre} (${canje.codigo})`,
        fecha: canje.fecha, por: personaId,
      }, ...d.movimientos],
    }));
    return { canje };
  };

  const entregar = (cod) =>
    setDatos((d) => ({ ...d, canjes: d.canjes.map((c) => (c.codigo === cod ? { ...c, estado: "Entregado" } : c)) }));

  const rechazar = (cod, motivo) => {
    const c = datos.canjes.find((x) => x.codigo === cod);
    if (!c) return;
    setDatos((d) => ({
      ...d,
      canjes: d.canjes.map((x) => (x.codigo === cod ? { ...x, estado: "Rechazado", motivo } : x)),
      premios: d.premios.map((p) => (p.id === c.premio ? { ...p, stock: p.stock + 1 } : p)),
      movimientos: [{
        id: id(), persona: c.persona, tipo: "reverso", puntos: c.costo,
        cat: "", proyecto: "",
        nota: `Devolución del canje ${c.codigo}${motivo ? ": " + motivo : ""}`,
        fecha: new Date().toISOString(), por: yo.id,
      }, ...d.movimientos],
    }));
  };

  const limpiarHistorial = () => {
    setDatos((d) => ({ ...d, movimientos: [], canjes: [] }));
    avisar("Historial borrado, saldos en cero");
  };

  const reiniciar = () => { setDatos(inicial()); setImgs({}); setYo(null); avisar("Datos de ejemplo restaurados"); };

  /* --- render --- */

  if (cargando || !datos) {
    return (
      <div className="rec" style={{ display: "grid", placeItems: "center", minHeight: "100vh" }}>
        <style>{CSS}</style>
        <span style={{ color: "var(--soft)" }}>Cargando el programa…</span>
      </div>
    );
  }

  if (!yo) {
    return (
      <div className="rec">
        <style>{CSS}</style>
        <Entrada datos={datos} entrar={(u) => { setYo(u); setSeccion(u.rol === "admin" ? "resumen" : "saldo"); }} />
      </div>
    );
  }

  const esAdmin = yo.rol === "admin";
  const pendientes = datos.canjes.filter((c) => c.estado === "Pendiente").length;

  const secciones = esAdmin
    ? [["resumen", "Resumen"], ["otorgar", "Otorgar puntos"], ["personas", "Personas"],
       ["premios", "Premios"], ["canjes", `Canjes${pendientes ? ` (${pendientes})` : ""}`], ["ajustes", "Ajustes"]]
    : [["saldo", "Mis puntos"], ["canjes", "Mis canjes"]];

  return (
    <div className="rec">
      <style>{CSS}</style>

      <header className="barra">
        <div className="barra-in">
          <Logo claro />
          <span className="barra-sep" aria-hidden="true" />
          <span className="programa">{datos.config.programa}</span>
          <span className="quien">{yo.nombre}</span>
          <button className="salir" onClick={() => setYo(null)}>Salir</button>
        </div>
      </header>

      <nav className="menu">
        <div className="menu-in">
          {secciones.map(([k, n]) => (
            <button key={k} aria-current={seccion === k} onClick={() => setSeccion(k)}>{n}</button>
          ))}
        </div>
      </nav>

      <main className="wrap" style={{ paddingTop: 24, paddingBottom: 48 }}>
        {falloGuardado && (
          <div className="nota" style={{ borderColor: "var(--alerta)", background: "#F6E6E0" }}>
            <b>No se guardaron los últimos cambios</b>
            Revise la conexión y repita la acción.
          </div>
        )}

        {!esAdmin && seccion === "saldo" && <MiSaldo datos={datos} imgs={imgs} yo={yo} canjear={canjear} avisar={avisar} />}
        {!esAdmin && seccion === "canjes" && <MisCanjes datos={datos} yo={yo} />}

        {esAdmin && seccion === "resumen" && <Resumen datos={datos} ir={setSeccion} />}
        {esAdmin && seccion === "otorgar" && <Otorgar datos={datos} otorgar={otorgar} avisar={avisar} />}
        {esAdmin && seccion === "personas" && <Personas datos={datos} setDatos={setDatos} avisar={avisar} />}
        {esAdmin && seccion === "premios" && <Premios datos={datos} setDatos={setDatos} imgs={imgs} setImgs={setImgs} avisar={avisar} />}
        {esAdmin && seccion === "canjes" && <Canjes datos={datos} entregar={entregar} rechazar={rechazar} avisar={avisar} />}
        {esAdmin && seccion === "ajustes" && <Ajustes datos={datos} setDatos={setDatos} yo={yo} avisar={avisar} reiniciar={reiniciar} limpiarHistorial={limpiarHistorial} />}
      </main>

      {aviso && <div className="aviso">{aviso}</div>}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

<script>
(function () {
  var root = document.getElementById("root");
  function falla(titulo, detalle) {
    root.innerHTML = '<div id="aviso"><div class="malo"><b></b><p></p><pre></pre></div></div>';
    root.querySelector("b").textContent = titulo;
    root.querySelector("p").textContent = "Tome una foto de este mensaje para revisarlo.";
    root.querySelector("pre").textContent = detalle;
  }
  function cargar(dirs, listo, error) {
    var i = 0;
    (function intento() {
      if (i >= dirs.length) return error();
      var s = document.createElement("script");
      s.src = dirs[i++]; s.crossOrigin = "anonymous";
      s.onload = listo; s.onerror = intento;
      document.head.appendChild(s);
    })();
  }
  var REACT = ["https://unpkg.com/react@18/umd/react.production.min.js",
               "https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js",
               "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"];
  var RDOM  = ["https://unpkg.com/react-dom@18/umd/react-dom.production.min.js",
               "https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js",
               "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"];
  var BABEL = ["https://unpkg.com/@babel/standalone/babel.min.js",
               "https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js",
               "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"];
  function noSePudo(n) {
    falla("No se pudieron cargar las librerias (" + n + ")",
      "Se intento con unpkg.com, jsdelivr.net y cdnjs.cloudflare.com y ninguno respondio.\n\n" +
      "1. Si esta viendo el archivo en un visor que bloquea contenido externo, abra la pagina publicada.\n" +
      "2. Si la red de la oficina bloquea esos dominios, pruebe con datos moviles.\n" +
      "3. Revise la conexion a internet.");
  }
  function arrancar() {
    try {
      var fuente = document.getElementById("codigo-app").textContent;
      var js = Babel.transform(fuente, { presets: [["react", { runtime: "classic" }]] }).code;
      (0, eval)(js);
    } catch (e) {
      falla("La aplicacion no arranco", (e && (e.stack || e.message)) || String(e));
      if (window.console) console.error(e);
    }
